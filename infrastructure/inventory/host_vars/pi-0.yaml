# host_vars/pi-0.yaml

# Networking (managed by the `network` role) — VLAN 1 / materia.local
network_v4_address: 192.168.1.2/24
network_v4_gateway: 192.168.1.1
network_v6_address: fdbd:4657:e91a:1::2/64

# Pi-hole web UI (managed by the `pihole` role) — envoy-internal route hostname
pihole_webserver_domain: pi-0.materia.wtf

# Pi-hole adlists (managed by the `pihole` role): the complete set; anything
# else on pi-0 is removed. pi-1 gets them via nebula-sync. Upstream NextDNS
# adds its own threat-intel and native-tracker blocking on top of these.
pihole_adlists:
  - { type: block, comment: "Drugs (archived upstream, frozen)", address: "https://blocklistproject.github.io/Lists/drugs.txt" }
  - { type: block, comment: "Phishing", address: "https://phishing.army/download/phishing_army_blocklist_extended.txt" }
  - { type: block, comment: "Stalkerware", address: "https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts" }
  - { type: block, comment: "Ads and trackers", address: "https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts" }
  - { type: block, comment: "Gambling", address: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/gambling.txt" }
  - { type: block, comment: "Ads and trackers", address: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.plus.txt" }
  - { type: block, comment: "Threat intelligence", address: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt" }
  - { type: block, comment: "Drugs", address: "https://raw.githubusercontent.com/olbat/ut1-blacklists/master/blacklists/drogue/domains" }
  - { type: block, comment: "Cryptojacking", address: "https://v.firebog.net/hosts/Prigent-Crypto.txt" }
  - { type: allow, comment: "GoodnessJSON Whitelist", address: "https://raw.githubusercontent.com/GoodnessJSON/PiHole-Whitelist/refs/heads/master/lists/optional-list.txt" }
  - { type: allow, comment: "GoodnessJSON Whitelist", address: "https://raw.githubusercontent.com/GoodnessJSON/PiHole-Whitelist/refs/heads/master/lists/referral-sites.txt" }
  - { type: allow, comment: "GoodnessJSON Whitelist", address: "https://raw.githubusercontent.com/GoodnessJSON/PiHole-Whitelist/refs/heads/master/lists/whitelist.txt" }
  - { type: allow, comment: "My Whitelist", address: "https://raw.githubusercontent.com/materia-ops/home-ops/refs/heads/main/kubernetes/apps/network/pihole-nebula-sync/resources/whitelist.txt" }

# Hand-made local DNS (FTL dns.hosts / dns.cnameRecords). Ensured present only:
