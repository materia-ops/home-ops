# Domain allow/deny entries: the complete set, like pihole_adlists.
pihole_domains:
  - { type: allow, kind: exact, comment: 'Added from Query Log', domain: 'cdn.tailwindcss.com' }
  - { type: allow, kind: exact, comment: 'WotLK Project Reforged', domain: 'pub-0f05631d243e4046993fc02ca7be9542.r2.dev' }
  - { type: allow, kind: regex, comment: 'Westpac', domain: '(\.|^)banking\.westpac\.com\.au$' }
  - { type: allow, kind: regex, comment: 'Reddit', domain: '(\.|^)redd\.it$' }
  - { type: allow, kind: regex, comment: 'Reddit', domain: '(\.|^)reddit\.com$' }
  - { type: allow, kind: regex, comment: 'Twitter', domain: '(\.|^)twimg\.com$' }
  - { type: allow, kind: regex, comment: 'Unity', domain: '(\.|^)unity3d\.com$' }
  - { type: allow, kind: regex, comment: 'Westpac', domain: '(\.|^)westpac\.com$' }
  - { type: allow, kind: regex, comment: 'Westpac', domain: '(\.|^)westpac\.com\.au$' }
  - { type: allow, kind: regex, comment: 'Reddit', domain: '[a-z]\.thumbs\.redditmedia\.com' }
  - { type: allow, kind: regex, comment: 'WhatsApp', domain: '^((www|(w[0-9]\.)?web|media((-[a-z]{3}|\.[a-z]{4})[0-9]{1,2}-[0-9](\.|-)(cdn|fna))?)\.)?whatsapp\.(com|net)$' }
  - { type: allow, kind: regex, comment: 'WhatsApp', domain: '^whatsapp-cdn-shv-[0-9]{2}-[a-z]{3}[0-9]\.fbcdn\.net$' }
