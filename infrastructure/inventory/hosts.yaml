all:
  vars:
    ansible_user: ansible
    ansible_become: true # Always use sudo
  children:
    proxmox:
      vars: &remote_vars
        # Per-group, not in all: implicit localhost would inherit it.
        ansible_python_interpreter: /usr/bin/python3
        # Host keys pinned in ../known_hosts by inventory name, so a DNS or IP
        # change (the network role owns both) fails closed, never TOFU.
        ansible_ssh_common_args: >-
          -o HostKeyAlias={{ inventory_hostname }}
          -o UserKnownHostsFile={{ playbook_dir }}/known_hosts
          -o GlobalKnownHostsFile=/dev/null
          -o StrictHostKeyChecking=yes
      hosts:
        pve-0:
          ansible_host: pve-0.internal
    raspberry_pis:
      vars: *remote_vars
      # Order matters for serial rollouts: replica (pi-1) before primary (pi-0)
      hosts:
        pi-1:
          ansible_host: pi-1.internal
        pi-0:
          ansible_host: pi-0.internal
