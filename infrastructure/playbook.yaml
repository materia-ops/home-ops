---
# Not the PiKVM: its read-only root needs the pikvm play's rw window.
- name: Configure Infrastructure Observability
  hosts: all:!pikvms
  become: true
  tags: ["observability"]

  pre_tasks:
    - name: Update apt cache (Debian/Ubuntu only)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'
      changed_when: false

    - name: Manage smartmontools package
      ansible.builtin.package:
        name: smartmontools
        state: "{{ smartmontools_state | default('present') }}"

  tasks:
    - name: Node Exporter
      when: node_exporter_enabled | bool
      ansible.builtin.include_role:
        name: prometheus.prometheus.node_exporter

    - name: ext4 error metrics
      when: node_exporter_enabled | bool
      ansible.builtin.include_role:
        name: ext4_metrics

    - name: Smartctl Exporter
      when: smartctl_exporter_enabled | bool
      ansible.builtin.include_role:
        name: prometheus.prometheus.smartctl_exporter

- name: Configure Raspberry Pi networking
  hosts: raspberry_pis
  become: true
  tags: ["network"]
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Networking
      ansible.builtin.include_role:
        name: network

- name: Configure dnscrypt-proxy on Piholes
  hosts: raspberry_pis
  become: true
  tags: ["dnscrypt"]
  serial: 1
  any_errors_fatal: true
  roles:
    - role: dnscrypt_proxy

- name: Configure Pi-hole on Piholes
  hosts: raspberry_pis
  become: true
  tags: ["pihole"]
  serial: 1
  any_errors_fatal: true
  roles:
    - role: pihole

- name: Configure unattended upgrades
  hosts: raspberry_pis:proxmox
  become: true
  tags: ["unattended_upgrades"]
  roles:
    - role: unattended_upgrades

- name: Configure PiKVMs
  hosts: pikvms
  become: true
  tags: ["pikvm"]
  roles:
    - role: pikvm
