---
# The PiKVM's root filesystem is read-only: writes happen between `rw` and
# `ro`. pikvm-update holds `/` rw itself, so never overlap one, whether it's
# the timer's or a manual run holding pacman's lock.
- name: Refuse to run during a package update
  ansible.builtin.shell: >-
    ! systemctl is-active -q pikvm-autoupdate.service
    && ! test -e /var/lib/pacman/db.lck
  changed_when: false
  check_mode: false

- name: Read the root filesystem mount options
  ansible.builtin.command: findmnt -no OPTIONS /
  register: pikvm_root_options
  changed_when: false
  check_mode: false

- name: Check the auto-update schedule parses
  ansible.builtin.command: >-
    systemd-analyze calendar
    "*-*-* {{ pikvm_autoupdate_time }} {{ pikvm_autoupdate_timezone }}"
  changed_when: false
  check_mode: false

# Rendered to root-only /run and validated alone, so check mode validates too
# and the live drop-in can't supply keys the candidate dropped.
- name: Create a scratch dir for validating kvmd overrides
  ansible.builtin.file:
    path: /run/pikvm-ansible/empty-override.d
    state: directory
    mode: "0700"
  changed_when: false
  check_mode: false

- name: Render the candidate kvmd overrides
  ansible.builtin.template:
    src: kvmd-override.yaml.j2
    dest: /run/pikvm-ansible/kvmd-override.yaml
    mode: "0600"
  changed_when: false
  check_mode: false
  diff: false

- name: Validate the candidate kvmd overrides
  ansible.builtin.command: >-
    kvmd -M --override-dir /run/pikvm-ansible/empty-override.d
    --override-config /run/pikvm-ansible/kvmd-override.yaml
  changed_when: false
  check_mode: false

- name: Read override.yaml
  ansible.builtin.slurp:
    src: /etc/kvmd/override.yaml
  register: pikvm_override_yaml

# The reset below discards override.yaml, so it may only hold what host_vars
# already carries (or nothing).
- name: Keep every kvmd override in host_vars
  vars:
    pikvm_override_live: "{{ pikvm_override_yaml.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that: pikvm_override_live in [none, {}] or pikvm_override_live == pikvm_kvmd_override
    fail_msg: >-
      /etc/kvmd/override.yaml sets values that pikvm_kvmd_override doesn't;
      move them into inventory/host_vars/{{ inventory_hostname }}.yaml.
    quiet: true

# Before rw, so a missing 1Password field fails the play with nothing changed.
- name: Read the PiKVM secrets from 1Password
  ansible.builtin.command:
    cmd: op read "op://{{ pikvm_op_vault }}/{{ pikvm_op_item }}/{{ item }}"
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ lookup('env', 'OP_SERVICE_ACCOUNT_TOKEN') }}"
  loop: [WEB_PASSWORD, TOTP_SECRET, CLOUDFLARE_DNS_API_TOKEN]
  delegate_to: localhost # the controller holds the op CLI + service-account token
  become: false
  register: pikvm_op
  changed_when: false
  check_mode: false
  no_log: true

- name: Keep the PiKVM secrets
  ansible.builtin.set_fact:
    pikvm_secrets: "{{ dict(pikvm_op.results | map(attribute='item') | zip(pikvm_op.results | map(attribute='stdout'))) }}"
  no_log: true

- name: Check the PiKVM secrets' shape
  ansible.builtin.assert:
    that:
      - pikvm_secrets.WEB_PASSWORD | length > 0
      - "'\n' not in pikvm_secrets.WEB_PASSWORD"
      - pikvm_secrets.TOTP_SECRET is match('[A-Z2-7]{16,}$')
      - pikvm_secrets.CLOUDFLARE_DNS_API_TOKEN is match('[A-Za-z0-9_-]{20,}$')
    fail_msg: >-
      1Password {{ pikvm_op_vault }}/{{ pikvm_op_item }}: WEB_PASSWORD must be one line,
      TOTP_SECRET a base32 seed (sudo kvmd-totp show), CLOUDFLARE_DNS_API_TOKEN an API token.
    quiet: true

# Restores the mount state it found, so a root someone left rw stays rw.
- name: Configure the PiKVM
  vars:
    pikvm_root_was_ro: "{{ 'ro' in pikvm_root_options.stdout.split(',') }}"
  block:
    - name: Make the root filesystem writable
      ansible.builtin.command: rw
      changed_when: false
      when: pikvm_root_was_ro | bool

    - name: Install the auto-update wrapper
      ansible.builtin.copy:
        src: pikvm-autoupdate.sh
        dest: /usr/local/bin/pikvm-autoupdate
        mode: "0755"

    - name: Install the auto-update service
      ansible.builtin.copy:
        src: pikvm-autoupdate.service
        dest: /etc/systemd/system/pikvm-autoupdate.service
        mode: "0644"

    - name: Schedule the auto-update
      ansible.builtin.template:
        src: pikvm-autoupdate.timer.j2
        dest: /etc/systemd/system/pikvm-autoupdate.timer
        mode: "0644"
      notify: Restart the auto-update timer

    # Enabling writes the timers.target.wants symlink, so it stays inside rw.
    # On a fresh host check mode never wrote the unit, so systemd can't find it.
    - name: Enable the auto-update timer
      ansible.builtin.systemd:
        name: pikvm-autoupdate.timer
        enabled: true
        state: started
        daemon_reload: true
      ignore_errors: "{{ ansible_check_mode }}"

    # kvmd reads every file in override.d (no extension filter), then
    # override.yaml on top, so no backups may land in that directory.
    - name: Template the kvmd overrides
      ansible.builtin.template:
        src: kvmd-override.yaml.j2
        dest: /etc/kvmd/override.d/materia.yaml
        mode: "0644"
      notify: Restart kvmd

    # kvmd ships override.yaml as comments only. Taking its .pacnew keeps the
    # file at the package default, so later kvmd updates replace it cleanly.
    - name: Look for a new default override.yaml from kvmd
      ansible.builtin.stat:
        path: /etc/kvmd/override.yaml.pacnew
      register: pikvm_override_pacnew

    - name: Read kvmd's new default override.yaml
      ansible.builtin.slurp:
        src: /etc/kvmd/override.yaml.pacnew
      register: pikvm_override_default
      when: pikvm_override_pacnew.stat.exists

    # Not remote_src: that path checks the read-only dir is writable even in
    # check mode, so Check fails.
    - name: Reset override.yaml to the kvmd default
      ansible.builtin.copy:
        content: "{{ pikvm_override_default.content | b64decode }}"
        dest: /etc/kvmd/override.yaml
        mode: "0644"
        backup: true
      when: pikvm_override_pacnew.stat.exists
      notify: Restart kvmd

    - name: Remove the merged override.yaml.pacnew
      ansible.builtin.file:
        path: /etc/kvmd/override.yaml.pacnew
        state: absent
      when: pikvm_override_pacnew.stat.exists

    - name: Validate the live kvmd configuration
      ansible.builtin.command: kvmd -M
      changed_when: false

    - name: Web UI login, TOTP and the certbot DNS token
      ansible.builtin.import_tasks: secrets.yaml

    - name: Config drop-ins, .pacnew files and rngd
      ansible.builtin.import_tasks: system.yaml

    # The observability play skips the PiKVM (all:!pikvms), so a
    # node_exporter_version bump lands here on the next pikvm run.
    - name: Node exporter
      ansible.builtin.include_role:
        name: prometheus.prometheus.node_exporter
      when: pikvm_node_exporter_enabled | bool

    # Inside the block: a failure after this point must not drop the restart.
    - name: Apply the changes before leaving the block
      ansible.builtin.meta: flush_handlers

  always:
    # One command, so no update can start between the check and `ro`.
    - name: Make the root filesystem read-only again
      ansible.builtin.shell: >-
        systemctl is-active -q pikvm-autoupdate.service
        || test -e /var/lib/pacman/db.lck
        || ro
      changed_when: false
      when: pikvm_root_was_ro | bool
