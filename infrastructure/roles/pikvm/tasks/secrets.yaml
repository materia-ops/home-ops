---
# Runs inside main.yaml's rw block. CI logs are public: no_log on anything that
# holds a secret, and diff: false where a write could print one.
- name: Read the IPMI and VNC service states
  ansible.builtin.command:
    argv: [systemctl, "{{ item }}", kvmd-ipmi.service, kvmd-vnc.service]
  loop: [is-enabled, is-active]
  register: pikvm_ipmi_vnc
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep IPMI and VNC off
  ansible.builtin.assert:
    that: >-
      pikvm_ipmi_vnc.results | map(attribute='stdout_lines') | flatten
      | difference(['disabled', 'masked', 'inactive', 'failed']) | length == 0
    fail_msg: >-
      kvmd-ipmi or kvmd-vnc is on while its password file holds kvmd's default;
      give it a field in 1Password {{ pikvm_op_vault }}/{{ pikvm_op_item }} first.
    quiet: true

# kvmd's own hasher, so a scheme change in kvmd can't break the comparison.
- name: Check the web UI user against htpasswd
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        from kvmd.crypto import KvmdHtpasswdFile
        htpasswd = KvmdHtpasswdFile("/etc/kvmd/htpasswd")
        user, passwd = sys.argv[1], sys.stdin.readline().rstrip("\n")
        print(json.dumps({"users": sorted(htpasswd.users()), "match": bool(htpasswd.check_password(user, passwd))}))
      - "{{ pikvm_web_user }}"
    stdin: "{{ pikvm_secrets.web_password }}"
  register: pikvm_htpasswd_check
  changed_when: false
  check_mode: false
  no_log: true

- name: Keep the htpasswd state
  ansible.builtin.set_fact:
    pikvm_htpasswd: "{{ pikvm_htpasswd_check.stdout | from_json }}"

# Sessions opened with the old password last until kvmd and kvmd-nginx restart.
- name: Set the web UI password from 1Password
  ansible.builtin.command:
    argv:
      - kvmd-htpasswd
      - "{{ 'set' if pikvm_web_user in pikvm_htpasswd.users else 'add' }}"
      - --read-stdin
      - --quiet
      - "{{ pikvm_web_user }}"
    stdin: "{{ pikvm_secrets.web_password }}"
  when: not pikvm_htpasswd.match
  changed_when: true
  no_log: true
  notify: [Restart kvmd, Restart kvmd-nginx]

# A reflash brings back kvmd's default admin/admin.
- name: Remove other web UI users
  ansible.builtin.command:
    argv: [kvmd-htpasswd, del, --quiet, "{{ item }}"]
  loop: "{{ pikvm_htpasswd.users | difference([pikvm_web_user]) }}"
  changed_when: true
  notify: [Restart kvmd, Restart kvmd-nginx]

# Read at every login, so a new seed needs no restart.
- name: Install the web UI TOTP secret
  ansible.builtin.copy:
    content: "{{ pikvm_secrets.totp_seed }}"
    dest: /etc/kvmd/totp.secret
    owner: kvmd
    group: kvmd
    mode: "0600"
  no_log: true
  diff: false

- name: Read the certbot runroot
  ansible.builtin.stat:
    path: "{{ pikvm_certbot_cloudflare_auth | dirname }}"
  register: pikvm_certbot_runroot

- name: Require kvmd-certbot to have issued the certificate once
  ansible.builtin.assert:
    that: pikvm_certbot_runroot.stat.isdir | default(false)
    fail_msg: >-
      {{ pikvm_certbot_cloudflare_auth | dirname }} is missing (a reflash?). Issue the
      certificate once by hand with `kvmd-certbot certonly --dns-cloudflare ...` (PiKVM docs:
      Let's Encrypt), then re-run.
    quiet: true

- name: Read the certbot Cloudflare credentials
  ansible.builtin.stat:
    path: "{{ pikvm_certbot_cloudflare_auth }}"
    checksum_algorithm: sha256
  register: pikvm_cloudflare_auth
  no_log: true # the checksum is of the token

# The PST partition stays ro outside kvmd-pstrun, which passes the environment
# through and sets KVMD_PST_DATA.
- name: Write the certbot Cloudflare token to the PST partition
  ansible.builtin.command:
    argv:
      - kvmd-pstrun
      - --
      - /bin/sh
      - -c
      - >-
        [ -n "$CLOUDFLARE_TOKEN" ] && umask 077 && f="$KVMD_PST_DATA/certbot/runroot/.cloudflare.auth"
        && printf 'dns_cloudflare_api_token = %s\n' "$CLOUDFLARE_TOKEN" >"$f.new"
        && chown kvmd-certbot:kvmd-certbot "$f.new" && mv "$f.new" "$f"
  environment:
    CLOUDFLARE_TOKEN: "{{ pikvm_secrets.cloudflare_token }}"
  vars:
    _content: "dns_cloudflare_api_token = {{ pikvm_secrets.cloudflare_token }}\n"
  when: >-
    not pikvm_cloudflare_auth.stat.exists
    or pikvm_cloudflare_auth.stat.checksum != _content | hash('sha256')
  changed_when: true
  no_log: true
  notify: Renew the kvmd certificate

# Enabling writes timers.target.wants, so it stays inside rw.
- name: Keep certbot's renewal timer on
  ansible.builtin.systemd:
    name: kvmd-certbot.timer
    enabled: true
    state: started
