---
# No daemon_reload: the enable task already ran it. On a fresh host check
# mode never wrote the unit, so systemd can't find it.
- name: Restart the auto-update timer
  ansible.builtin.systemd:
    name: pikvm-autoupdate.timer
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart kvmd
  ansible.builtin.systemd:
    name: kvmd
    state: restarted

- name: Restart kvmd-nginx
  ansible.builtin.systemd:
    name: kvmd-nginx
    state: restarted

- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# The dry run (LE staging, real DNS-01) proves the token; the real renew only
# touches due certs.
- name: Renew the kvmd certificate
  ansible.builtin.shell: kvmd-certbot renew --dry-run && kvmd-certbot renew
  changed_when: true
