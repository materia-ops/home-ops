---
# Recomputes the next elapse after a schedule change. The enable task has
# already run daemon-reload by the time handlers fire. On a fresh host check
# mode never wrote the unit, so systemd can't find it.
- name: Restart the auto-update timer
  ansible.builtin.systemd:
    name: pikvm-autoupdate.timer
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

# Drops open web UI sessions and the video stream for a few seconds.
- name: Restart kvmd
  ansible.builtin.systemd:
    name: kvmd
    state: restarted

# With kvmd, ends web sessions after a password change (kvmd-htpasswd's own advice).
- name: Restart kvmd-nginx
  ansible.builtin.systemd:
    name: kvmd-nginx
    state: restarted

# Open SSH sessions, Ansible's own included, survive a reload.
- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

# The journal is volatile, in /run, so a restart keeps it.
- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# The dry run (Let's Encrypt staging, real DNS-01) fails a bad token now; the
# real renew only touches due certs. kvmd-certbot reloads kvmd-nginx itself.
- name: Renew the kvmd certificate
  ansible.builtin.shell: kvmd-certbot renew --dry-run && kvmd-certbot renew
  changed_when: true
