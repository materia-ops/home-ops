---
- name: Install the ext4 metrics script
  ansible.builtin.copy:
    src: ext4-metrics.sh
    dest: /usr/local/bin/ext4-metrics
    mode: "0755"

- name: Recreate the textfile dir at boot
  ansible.builtin.copy:
    content: "d {{ ext4_metrics_textfile_dir }} 0775 {{ ext4_metrics_user }} {{ ext4_metrics_user }} -\n"
    dest: /etc/tmpfiles.d/node-exporter-textfile.conf
    mode: "0644"
  when: ext4_metrics_textfile_dir is match('/run/')

- name: Install the ext4 metrics service
  ansible.builtin.template:
    src: ext4-metrics.service.j2
    dest: /etc/systemd/system/ext4-metrics.service
    mode: "0644"

- name: Install the ext4 metrics timer
  ansible.builtin.copy:
    src: ext4-metrics.timer
    dest: /etc/systemd/system/ext4-metrics.timer
    mode: "0644"

# On a fresh host check mode never wrote the units, so systemd can't find them.
- name: Enable the ext4 metrics timer
  ansible.builtin.systemd:
    name: ext4-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
