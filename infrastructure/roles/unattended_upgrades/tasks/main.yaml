---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

# A syntax error in apt.conf.d breaks every apt command on the host, so each
# file is parsed with apt-config before it replaces the live one.
- name: Enable the daily list refresh and unattended upgrade
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      // Managed by Ansible (infrastructure/roles/unattended_upgrades)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    validate: apt-config -c %s dump

- name: Template the unattended-upgrades policy
  ansible.builtin.template:
    src: 52unattended-upgrades-materia.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-materia
    mode: "0644"
    validate: apt-config -c %s dump

- name: Create apt timer drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.timer.d"
    state: directory
    mode: "0755"
  loop:
    - apt-daily
    - apt-daily-upgrade

- name: Schedule the package list refresh
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily.timer.d/override.conf
    mode: "0644"
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ unattended_upgrades_update_time }}
      RandomizedDelaySec=30m
  notify: Reload systemd

- name: Schedule the unattended upgrade
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    mode: "0644"
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ unattended_upgrades_upgrade_time }}
      RandomizedDelaySec=0
  notify: Reload systemd

- name: Flush handlers so the timers pick up the new schedule
  ansible.builtin.meta: flush_handlers

- name: Enable the apt timers
  ansible.builtin.systemd:
    name: "{{ item }}.timer"
    enabled: true
    state: started
  loop:
    - apt-daily
    - apt-daily-upgrade
