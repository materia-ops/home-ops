---
# The full config includes the password hash and TOTP secret: keep it out of logs.
- name: Read current FTL config
  ansible.builtin.uri:
    url: http://127.0.0.1/api/config
    headers: "{{ _pihole_sid_header }}"
  register: _pihole_config
  check_mode: false # read-only probe
  no_log: true

# Per-key flags: restart_dnsmasq marks the settings FTL restarts itself for.
- name: Read the FTL config flags
  ansible.builtin.uri:
    url: http://127.0.0.1/api/config?detailed=true
    headers: "{{ _pihole_sid_header }}"
  register: _pihole_config_detailed
  check_mode: false
  no_log: true

- name: Note the changed settings that restart FTL
  ansible.builtin.set_fact:
    _pihole_restart_keys: >-
      {{ pihole_ftl_config | ftl_restart_keys(_pihole_config.json.config, _pihole_config_detailed.json.config) }}

- name: Read the FTL uptime
  ansible.builtin.uri:
    url: http://127.0.0.1/api/info/ftl
    headers: "{{ _pihole_sid_header }}"
  register: _pihole_ftl_before
  check_mode: false

- name: Apply FTL settings
  ansible.builtin.uri:
    url: http://127.0.0.1/api/config
    headers: "{{ _pihole_sid_header }}"
    method: PATCH
    body_format: json
    body: { config: "{{ pihole_ftl_config }}" }
  when: (_live | combine(pihole_ftl_config, recursive=True)) != _live
  vars:
    _live: "{{ _pihole_config.json.config }}"
  register: _pihole_config_set
  changed_when: true

# FTL restarts in place a moment after answering the PATCH and keeps its PID:
# wait for the uptime to reset, or a 401.
- name: Wait for FTL to restart after a settings change
  ansible.builtin.uri:
    url: http://127.0.0.1/api/info/ftl
    headers: "{{ _pihole_sid_header }}"
    status_code: [200, 401]
  register: _pihole_ftl_after
  until: >-
    _pihole_ftl_after.status == 401 or
    (_pihole_ftl_after.status == 200 and _pihole_ftl_after.json.ftl.uptime < _pihole_ftl_before.json.ftl.uptime)
  retries: 20
  delay: 3
  failed_when: false
  when:
    - _pihole_config_set is changed
    - _pihole_restart_keys | length > 0

- name: Wait for the FTL API after a settings change
  ansible.builtin.uri:
    url: http://127.0.0.1/api/info/version
    headers: "{{ _pihole_sid_header }}"
    status_code: [200, 401]
  register: _pihole_api
  until: _pihole_api.status in [200, 401]
  retries: 20
  delay: 3
  when: _pihole_config_set is changed

- name: Log in again after a settings change
  ansible.builtin.include_tasks: login.yaml
  when: _pihole_config_set is changed
