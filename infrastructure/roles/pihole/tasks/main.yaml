---
- name: Read current dns.upstreams
  ansible.builtin.command: pihole-FTL --config dns.upstreams
  register: _pihole_upstreams
  changed_when: false
  check_mode: false   # read-only probe

# FTL prints the array as `[ a, b ]`; compare the bare entries.
- name: Set dns.upstreams
  ansible.builtin.command:
    argv: [pihole-FTL, --config, dns.upstreams, "{{ pihole_dns_upstreams | to_json }}"]
  when: (_pihole_upstreams.stdout | regex_findall('[^\[\],"\s]+')) != pihole_dns_upstreams
  changed_when: true

- name: Read current webserver.domain
  ansible.builtin.command: pihole-FTL --config webserver.domain
  register: _pihole_webserver_domain
  changed_when: false
  check_mode: false   # read-only probe; must run even in --check so dry-runs are accurate

- name: Read TLS certificate issuer and names
  ansible.builtin.command: openssl x509 -in {{ pihole_tls_cert }} -noout -issuer -ext subjectAltName
  register: _pihole_tls_cert
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe

# openssl spaces RDNs differently across versions (O=Pi-hole vs O = Pi-hole);
# the SAN match is anchored so pi.hole doesn't match pi.hole.example
- name: Classify the TLS certificate
  ansible.builtin.set_fact:
    _pihole_tls_ours: "{{ _pihole_tls_cert.rc == 0 and _pihole_tls_cert.stdout is search('O *= *Pi-hole') }}"
    _pihole_tls_san: "{{ 'DNS:' ~ (pihole_webserver_domain | regex_escape) ~ '(,|$)' }}"

# FTL only generates its self-signed cert when the file is missing, so after a
# domain change it keeps serving the old name (CERTIFICATE_DOMAIN_MISMATCH).
# Never touch a cert FTL didn't issue.
- name: Remove a Pi-hole-issued TLS certificate that doesn't cover the domain
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ pihole_tls_cert }}"
    - "{{ pihole_tls_cert | dirname }}/tls.crt"
    - "{{ pihole_tls_cert | dirname }}/tls_ca.crt"
  when:
    - _pihole_tls_ours | bool
    - _pihole_tls_cert.stdout is not search(_pihole_tls_san, multiline=True)
  notify: Restart pihole-FTL

- name: Set webserver.domain
  ansible.builtin.command:
    argv: [pihole-FTL, --config, webserver.domain, "{{ pihole_webserver_domain }}"]
  when: _pihole_webserver_domain.stdout | trim != pihole_webserver_domain
  # FTL rereads pihole.toml and restarts itself (restart-flagged key): a few
  # seconds without DNS on this Pi only, since the play is serial
  changed_when: true

- name: Flush handlers so FTL regenerates the certificate before validation
  ansible.builtin.meta: flush_handlers

# Functional gate: with serial:1 + any_errors_fatal, a failure here on the
# first Pi aborts the rollout before the next Pi is touched.
- name: Validate the web UI serves its configured name
  ansible.builtin.uri:
    url: http://127.0.0.1/admin/
    headers:
      Host: "{{ pihole_webserver_domain }}"
    follow_redirects: none
    status_code: [200, 302]   # 302 = login redirect once a password is set; 403 = Host refused
  register: _pihole_validate
  until: _pihole_validate.status in [200, 302]
  retries: 10   # covers the FTL restart
  delay: 3
  when: not ansible_check_mode   # the new setting isn't really applied in --check

- name: Validate the TLS certificate covers the domain
  ansible.builtin.command: openssl x509 -in {{ pihole_tls_cert }} -noout -ext subjectAltName
  register: _pihole_tls_validate
  until: _pihole_tls_validate.stdout is search(_pihole_tls_san, multiline=True)
  retries: 10
  delay: 3
  changed_when: false
  when:
    - not ansible_check_mode
    - _pihole_tls_ours | bool   # a custom cert is the admin's to manage

- name: Manage adlists
  when: pihole_adlists | length > 0
  block:
    - name: Read current adlists
      ansible.builtin.uri:
        url: http://127.0.0.1/api/lists
      register: _pihole_lists
      check_mode: false   # read-only probe

    # Lists are keyed by type|address; the API takes the address URL-encoded in the path.
    - name: Index current and wanted adlists
      ansible.builtin.set_fact:
        _adlists_have: "{{ dict(_lists | map(attribute='type') | zip(_lists | map(attribute='address')) | map('join', '|') | zip(_lists)) }}"
        _adlists_want: "{{ pihole_adlists | map(attribute='type') | zip(pihole_adlists | map(attribute='address')) | map('join', '|') | list }}"
      vars:
        _lists: "{{ _pihole_lists.json.lists }}"

    - name: Add missing adlists
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/lists?type={{ item.type }}"
        method: POST
        body_format: json
        body: { address: "{{ item.address }}", comment: "{{ item.comment }}", groups: [0], enabled: true }
        status_code: [200, 201]
      loop: "{{ pihole_adlists }}"
      loop_control: { label: "{{ item.type }} {{ item.address }}" }
      when: (item.type ~ '|' ~ item.address) not in _adlists_have
      register: _adlists_added
      changed_when: true

    - name: Fix adlist comment or enabled drift
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/lists/{{ item.address | urlencode | replace('/', '%2F') }}?type={{ item.type }}"
        method: PUT
        body_format: json
        body: { comment: "{{ item.comment }}", groups: [0], enabled: true }
      loop: "{{ pihole_adlists }}"
      loop_control: { label: "{{ item.type }} {{ item.address }}" }
      when:
        - (item.type ~ '|' ~ item.address) in _adlists_have
        - _have.comment != item.comment or not _have.enabled
      vars:
        _have: "{{ _adlists_have[item.type ~ '|' ~ item.address] }}"
      register: _adlists_fixed
      changed_when: true

    - name: Remove adlists not in the inventory
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/lists/{{ item.value.address | urlencode | replace('/', '%2F') }}?type={{ item.value.type }}"
        method: DELETE
        status_code: [204]
      loop: "{{ _adlists_have | dict2items }}"
      loop_control: { label: "{{ item.key }}" }
      when: item.key not in _adlists_want
      register: _adlists_removed
      changed_when: true

    - name: Rebuild gravity after adlist changes
      ansible.builtin.uri:
        url: http://127.0.0.1/api/action/gravity
        method: POST
        timeout: 900
      when: (_adlists_added.results + _adlists_fixed.results + _adlists_removed.results) | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0
      changed_when: true

    - name: Re-read adlists after gravity
      ansible.builtin.uri:
        url: http://127.0.0.1/api/lists
      register: _pihole_lists_after
      check_mode: false

    # Warn, don't fail: a list host being briefly down must not block a DNS rollout.
    - name: Warn about adlists gravity could not download
      ansible.builtin.debug:
        msg: "Unavailable adlists (status 3/4): {{ _unavailable | map(attribute='address') | list }}"
      when: _unavailable | length > 0
      vars:
        _unavailable: "{{ _pihole_lists_after.json.lists | selectattr('status', 'in', [3, 4]) | list }}"
