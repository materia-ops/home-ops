---
# pihole role defaults
# Name the web UI is reached by (the ingress hostname). With no web password
# set, FTL 6.8+ only serves Host names it considers its own: IPs, localhost,
# pi.hole, its hostname(.dns.domain) and this one. FTL default: pi.hole.
pihole_webserver_domain: "pi.hole"

# FTL's webserver.tls.cert (self-signed, regenerated for the domain above)
pihole_tls_cert: "/etc/pihole/tls.pem"

# FTL settings both Pis must hold (nested like pihole.toml; merged over the live
# config, so keys not listed keep their current value).
pihole_ftl_config:
  dns:
    domain:
      name: internal
    domainNeeded: true
    expandHosts: true
    interface: eth0
    listeningMode: ALL
    piholePTR: HOSTNAMEFQDN
    revServers:
      - "true,192.168.1.0/24,192.168.1.1,internal"
      - "true,192.168.10.0/24,192.168.1.1,internal"
      - "true,192.168.20.0/24,192.168.1.1,internal"
    # Local dnscrypt only (home NextDNS profile). Not the cluster VIP .10.2: it
    # uses the kubernetes profile, and dnsmasq would send it most queries.
    upstreams:
      - "127.0.0.1#5053"
  ntp:
    sync:
      server: au.pool.ntp.org
  webserver:
    # Localhost + k8s node IPs (pod egress is masqueraded to them). Break-glass: docs/operations.md.
    acl: "{{ (['+127.0.0.1', '+[::1]'] + (_pihole_k8s_nodes.values() | sort | map('regex_replace', '^', '+') | list)) | join(',') }}"
    headers:
      - "X-DNS-Prefetch-Control: off"
      - "Content-Security-Policy: default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
      - "X-Frame-Options: DENY"
      - "X-XSS-Protection: 0"
      - "X-Content-Type-Options: nosniff"
      - "Referrer-Policy: strict-origin-when-cross-origin"
    # Sliding. Automation logs out, so 12h human sessions stay under max_sessions (16).
    session:
      timeout: 43200

# APP_PASSWORD + APP_PWHASH (both Pis share it); vault readable only by CI and the cluster.
pihole_op_vault: pihole
pihole_op_item: pihole

# Set on the primary only (host_vars/pi-0.yaml); nebula-sync copies them to pi-1.
# Empty = leave that part alone.
pihole_adlists: [] # {type, comment, address}; authoritative
pihole_domains: [] # {type, kind, comment, domain}; authoritative
pihole_local_hosts: [] # "ip name" entries in dns.hosts; authoritative
pihole_local_cnames: [] # "alias,target" entries in dns.cnameRecords; authoritative
pihole_node_records: false # also ensure "<ip> <node>[.<dns.domain>]" per k8s node
pihole_external_dns_zones: ["materia.wtf"] # records under these belong to external-dns; never pruned

# Node IPs come only from the Talos node files' `# talos:node-ip=` header.
pihole_talos_nodes_dir: "{{ playbook_dir }}/../talos/nodes"

# Inventory host that mirrors the primary via nebula-sync; its gravity is rebuilt
# after adlist changes once the sync has landed.
pihole_replica: pi-1
