---
name: Configure Infrastructure

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Ansible --tags (comma-sep: dnscrypt, network, observability, pihole, unattended_upgrades). Blank = all."
        required: false
        type: string
      limit:
        description: "Restrict to host(s)/group (ansible --limit). Blank = all."
        required: false
        type: string
      check_only:
        description: "Dry run only — run Check (--check --diff) and skip Apply."
        required: false
        type: boolean
        default: true
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/ansible.yaml"
      - "infrastructure/**"
      - "!infrastructure/**/*.md"
      - "talos/nodes/**"
  push:
    branches: ["main"]
    paths:
      - "infrastructure/**"
      - "!infrastructure/**/*.md"
      - "talos/nodes/**" # node IPs feed the pihole role

permissions: {}

env:
  IMAGE_REPO: ghcr.io/materia-ops/home-ops-ansible

jobs:
  # PR path: the live dry run needs credentials a pull_request must not get, so
  # this only syntax-checks the playbook in the job image on a hosted runner.
  validate:
    name: Validate (Image + Syntax Check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GHCR
        continue-on-error: true # fork PRs: fall through to a local build
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull existing image
        id: pull
        env:
          HASH: ${{ hashFiles('infrastructure/Dockerfile', 'infrastructure/requirements.txt', 'infrastructure/requirements.yaml') }}
        run: |
          IMAGE="${IMAGE_REPO}:${HASH:0:16}"
          if docker pull -q "$IMAGE"; then
            docker tag "$IMAGE" home-ops-ansible:pr; echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "$IMAGE not published, building"
          fi
      - name: Setup Docker Buildx
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Image
        if: steps.pull.outputs.pulled != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infrastructure
          load: true
          tags: home-ops-ansible:pr
      - name: Syntax Check
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infrastructure -e ANSIBLE_CONFIG=./ansible.cfg \
            home-ops-ansible:pr \
            ansible-playbook -i inventory/hosts.yaml playbook.yaml --syntax-check

  # Main trusts an existing tag only if main's own workflow attested it: any
  # ref with packages: write can overwrite a tag, so other refs get a dev- tag.
  # No concurrency group: a pending run would be cancelled by a third arrival.
  image:
    name: Image (build if missing)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}@${{ steps.exists.outputs.digest || steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image tag
        id: ref
        env:
          HASH: ${{ hashFiles('infrastructure/Dockerfile', 'infrastructure/requirements.txt', 'infrastructure/requirements.yaml') }}
          PREFIX: ${{ github.ref != 'refs/heads/main' && 'dev-' || '' }}
        run: echo "image=${IMAGE_REPO}:${PREFIX}${HASH:0:16}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check for existing image
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.ref.outputs.image }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          REPO: ${{ github.repository }}
        run: |
          if ! DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "$IMAGE missing, building"; exit 0
          fi
          if [ "$ON_MAIN" = "true" ] && ! gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/ansible.yaml" --source-ref refs/heads/main >/dev/null; then
            echo "::warning::$IMAGE@$DIGEST has no main-built attestation, rebuilding"; exit 0
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"; echo "$IMAGE@$DIGEST exists, skipping build"
      - name: Setup Docker Buildx
        if: steps.exists.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image
        id: build
        if: steps.exists.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infrastructure
          push: true
          tags: ${{ steps.ref.outputs.image }}
      - name: Attest image
        if: steps.exists.outputs.digest == '' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Only roles/dnscrypt_proxy changed -> dnscrypt; roles/pihole or talos/nodes -> pihole;
  # roles/unattended_upgrades -> unattended_upgrades; only group_vars -> observability;
  # structural files (playbook/inventory/requirements/cfg/Dockerfile) or a manual blank -> all.
  # Diff from the last successful push run: cancelled runs' changes must apply.
  plan:
    name: Plan (decide tags)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tags: ${{ steps.decide.outputs.tags }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Decide ansible --tags from changed paths
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAGS: ${{ inputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "tags=${DISPATCH_TAGS}" >> "$GITHUB_OUTPUT"
            echo "dispatch -> tags='${DISPATCH_TAGS}' (blank = all)"
            exit 0
          fi
          LIST="$RUNNER_TEMP/changed-files"
          if ! INFO="$(python3 .github/scripts/ansible_last_applied.py --files "$LIST")"; then
            echo "tags=" >> "$GITHUB_OUTPUT"; echo "::warning::last applied commit unknown -> all"; exit 0
          fi
          BASE="$(sed -n 's/^base=//p' <<<"$INFO")"
          STATUS="$(sed -n 's/^status=//p' <<<"$INFO")"
          COMPLETE="$(sed -n 's/^complete=//p' <<<"$INFO")"
          echo "last applied: ${BASE:-none} (this commit is $STATUS of it)"
          if [ "$STATUS" != "ahead" ] || [ "$COMPLETE" != "true" ]; then
            echo "tags=" >> "$GITHUB_OUTPUT"; echo "no usable diff from the last applied commit -> all"; exit 0
          fi
          FILES="$(cat "$LIST")"
          echo "Changed files:"; printf '%s\n' "$FILES"
          if printf '%s\n' "$FILES" | grep -qE '^infrastructure/(playbook\.yaml|requirements\.(in|txt|ya?ml)|ansible\.cfg|Dockerfile|inventory/hosts\.yaml|known_hosts)$'; then
            echo "tags=" >> "$GITHUB_OUTPUT"; echo "structural change -> all"; exit 0
          fi
          SEL=""
          if printf '%s\n' "$FILES" | grep -qE '^infrastructure/roles/dnscrypt_proxy/'; then SEL="${SEL:+$SEL,}dnscrypt"; fi
          if printf '%s\n' "$FILES" | grep -qE '^infrastructure/roles/network/'; then SEL="${SEL:+$SEL,}network"; fi
          if printf '%s\n' "$FILES" | grep -qE '^(infrastructure/roles/pihole/|talos/nodes/)'; then SEL="${SEL:+$SEL,}pihole"; fi
          if printf '%s\n' "$FILES" | grep -qE '^infrastructure/roles/unattended_upgrades/'; then SEL="${SEL:+$SEL,}unattended_upgrades"; fi
          if printf '%s\n' "$FILES" | grep -qE '^infrastructure/inventory/group_vars/'; then SEL="${SEL:+$SEL,}observability"; fi
          echo "tags=$SEL" >> "$GITHUB_OUTPUT"
          echo "resolved tags='$SEL' (blank = all)"

  # Holds credentials and runs on the self-hosted runner, so it must stay off
  # the pull_request path.
  ansible:
    name: Ansible Check + Apply
    needs: [image, plan]
    if: github.event_name != 'pull_request'
    runs-on: home-ops-runner
    # A third arrival cancels the pending run; plan's diff base makes that lossless.
    concurrency:
      group: ansible-hosts
      cancel-in-progress: false
    # `infrastructure` admits only main; `infrastructure-preview` needs a reviewer.
    environment: ${{ github.ref == 'refs/heads/main' && 'infrastructure' || 'infrastructure-preview' }}
    permissions:
      actions: read
      contents: read
      packages: read
    container:
      # Digest-pinned by the image job (tag@sha256), which zizmor cannot see.
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        # Job containers default to sh; the steps use bash arrays.
        shell: bash
        working-directory: infrastructure
    env:
      # The checkout can be world-writable inside the job pod, and Ansible
      # silently ignores a cwd ansible.cfg there; an explicit path is honored.
      ANSIBLE_CONFIG: ./ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same condition as Apply: a stale rerun would otherwise roll the hosts back.
      - name: Refuse to apply a commit older than the last Apply
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.check_only)) && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          INFO="$(python3 ../.github/scripts/ansible_last_applied.py)"
          BASE="$(sed -n 's/^base=//p' <<<"$INFO")"
          if [ "$(sed -n 's/^status=//p' <<<"$INFO")" = "behind" ]; then
            echo "::error::$SHA is behind $BASE, which a push run already applied; refusing to roll the hosts back"
            exit 1
          fi
          echo "last applied: ${BASE:-none}; $SHA is not behind it"
      - name: Setup SSH Key
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_INFRA_SERVICE_ACCOUNT_TOKEN }}
        # ssh resolves ~ from passwd (/root), not the job container's $HOME, so
        # hand Ansible the key path.
        run: |
          KEY="$RUNNER_TEMP/ansible_id_ed25519"
          (umask 077 && op read "op://infrastructure/ansible/ANSIBLE_PRIVATE_KEY" > "$KEY")
          echo "ANSIBLE_PRIVATE_KEY_FILE=$KEY" >> "$GITHUB_ENV"
      - name: Run Ansible Playbook (Check Mode)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_INFRA_SERVICE_ACCOUNT_TOKEN }}
          TAGS: ${{ needs.plan.outputs.tags }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "$TAGS" ]; then args+=(--tags "$TAGS"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          ansible-playbook -i inventory/hosts.yaml playbook.yaml --check --diff "${args[@]}"
      - name: Run Ansible Playbook (Apply)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.check_only)) && github.ref == 'refs/heads/main'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_INFRA_SERVICE_ACCOUNT_TOKEN }}
          TAGS: ${{ needs.plan.outputs.tags }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=()
          if [ -n "$TAGS" ]; then args+=(--tags "$TAGS"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); fi
          ansible-playbook -i inventory/hosts.yaml playbook.yaml "${args[@]}"
      # RUNNER_TEMP is on the runner's work volume (node disk), not pod-ephemeral.
      - name: Remove SSH Key
        if: always()
        run: rm -f "$RUNNER_TEMP/ansible_id_ed25519"
