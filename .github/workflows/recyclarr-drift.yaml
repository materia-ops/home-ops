---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Recyclarr Drift

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/recyclarr_drift.py
      - kubernetes/apps/media/arr-apps/recyclarr/app/config/**
      - kubernetes/apps/media/arr-apps/recyclarr/drift-baseline.json
  schedule:
    - cron: 0 21 * * 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  report:
    name: Recyclarr Drift - Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Diff TRaSH Guides against the reviewed baseline
        run: python3 .github/scripts/recyclarr_drift.py --out "$RUNNER_TEMP/drift.md"

      # Report-only: one open issue, refreshed in place and closed once clean.
      - name: Sync drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "recyclarr: TRaSH Guides changes to review"
        run: |
          report="$RUNNER_TEMP/drift.md"
          # plain listing, not --search: the search index lags a just-created issue
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,body --jq '[.[] | select(.body | contains("<!-- recyclarr-drift -->"))][0].number // empty')
          if [ -s "$report" ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$report"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$report"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Nothing left to review against the baseline."
          fi
