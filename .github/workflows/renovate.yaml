---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  # Canary: a PR that moves the runner pin runs the candidate image as a
  # full dry run through the same assertion (lookup mode sets no per-repo
  # result); the pin's automerge waits on it (platformAutomerge: false, so
  # Renovate itself checks the result instead of GitHub auto-merge).
  # pull_request_target: main's copy of this file runs, so a branch never
  # holds the github-bot key; the PR contributes only the candidate
  # RUNNER_VERSION, read as data (see "Resolve the runner version").
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
    paths:
      - .github/workflows/renovate.yaml
  schedule:
    - cron: 20 * * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true
  repository_dispatch:
    # Fired by the source repos (raidscope, wow-panel, azerothcore-image)
    # the moment they publish a new image, so the bump PR is opened right away
    # instead of waiting up to an hour for the schedule above.
    types: [image-published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    # The 1Password token lives only in this Environment, which admits main;
    # canary runs qualify because pull_request_target runs on the base ref.
    environment: ci-main
    # Same-repo canaries only.
    if: >-
      ${{
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    permissions:
      contents: read
      packages: read
      statuses: write # canary verdict on the PR head (see "Report the canary")
    env:
      # Job-level so the assertion step can read them. The filter is a
      # literal list: the assertion walks it, so a glob here breaks the gate.
      RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }},${{ github.repository_owner }}/azerothcore-image,${{ github.repository_owner }}/raidscope,${{ github.repository_owner }}/materia-core,${{ github.repository_owner }}/wow-panel,${{ github.repository_owner }}/wow-realmchat
      # Run-unique because Renovate appends; the action bind-mounts the host
      # /tmp into the container, and Renovate lowercases this value.
      RENOVATE_LOG_FILE: /tmp/renovate-${{ github.run_id }}-${{ github.run_attempt }}.log
      # The runner pin. Not RENOVATE_-prefixed: it must not reach the container.
      RUNNER_VERSION: "44.221.6"
    steps:
      # A pull_request_target run's own check lands on main's commit, which
      # Renovate's merge gate never reads; the verdict goes on the PR head as
      # a commit status instead, pending from the first step.
      - name: Mark the canary pending
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state=pending -f context="Renovate canary" \
            -f description="Dry run of the candidate runner" -f target_url="${RUN_URL}" --silent

      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.42.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://ci/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://ci/github-bot/GITHUB_BOT_APP_PRIVATE_KEY
          RENOVATE_GHCR_TOKEN: op://ci/ghcr-pull/token

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          # A canary (pull_request_target) is a dry run: read-only scopes, and no
          # workflows permission (write-only; an empty input is skipped), so a
          # PR that edits this file cannot spend a write token before review.
          permission-checks: ${{ github.event_name == 'pull_request_target' && 'read' || 'write' }}
          permission-contents: ${{ github.event_name == 'pull_request_target' && 'read' || 'write' }}
          permission-issues: ${{ github.event_name == 'pull_request_target' && 'read' || 'write' }}
          permission-pull-requests: ${{ github.event_name == 'pull_request_target' && 'read' || 'write' }}
          permission-statuses: ${{ github.event_name == 'pull_request_target' && 'read' || 'write' }}
          permission-vulnerability-alerts: read
          # workflows:write is load-bearing: the github-actions manager bumps
          # SHA-pinned actions inside .github/workflows/** (audited 2026-07-18,
          # security review #8 - do not drop without disabling that manager).
          permission-workflows: ${{ github.event_name != 'pull_request_target' && 'write' || '' }}
          # Renovate also manages the azerothcore-image source pins
          # (versions.json git-refs manager), wow-panel's npm/actions/base
          # image, raidscope's pip/actions/base image, materia-core's
          # npm/actions, and wow-realmchat's nuget/actions/Ollama pin; the
          # github-bot App must be INSTALLED on those repos or token
          # generation fails. .github is the org config repo: every fleet
          # repo extends github>materia-ops/.github//renovate/default, and
          # renovate resolves that preset with THIS token - without .github
          # in scope the fetch 404s and every repo aborts as "invalid config".
          repositories: |
            ${{ github.event.repository.name }}
            .github
            azerothcore-image
            raidscope
            materia-core
            wow-panel
            wow-realmchat

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # The canary's only input from the PR: the candidate pin, fetched as
      # data and accepted only as a bare semver.
      - name: Resolve the runner version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            v="$(gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/renovate.yaml?ref=${HEAD_SHA}" \
              | sed -nE 's/^ +RUNNER_VERSION: .([0-9]+\.[0-9]+\.[0-9]+).$/\1/p' | head -n1)"
            if [ -z "${v}" ]; then
              echo "::error title=No candidate RUNNER_VERSION::the PR head has no RUNNER_VERSION: \"X.Y.Z\" line"
              exit 1
            fi
          else
            v="${INPUT_VERSION:-${RUNNER_VERSION}}"
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
          echo "runner version: ${v}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify the runner image signature
        # Renovate signs every image keyless from its build workflow. The
        # 3-day soak only delays new versions; a re-pushed tag is pulled
        # within the hour and runs with the fleet-wide App token.
        env:
          IMAGE: ghcr.io/renovatebot/renovate:${{ steps.version.outputs.version }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/renovatebot/renovate/\.github/workflows/build\.yml@' \
            "${IMAGE}" > /dev/null
          echo "signature verified: ${IMAGE}"

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          # Renovate's unhandledRejection handler only logs, so a rejection
          # outside start() - a broken runner build (#1681) - exited 0 and
          # left this step green. strict raises it as an uncaught exception.
          NODE_OPTIONS: --unhandled-rejections=strict
          RENOVATE_AUTODISCOVER: true
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request_target' && 'full' || inputs.dryRun }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          # info is load-bearing: the assertion reads an info-level record.
          # LOG_LEVEL (the dispatch input) shapes stdout only.
          RENOVATE_LOG_FILE_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_HOST_RULES: '[{"matchHost": "ghcr.io", "hostType": "docker", "username": "malpractis", "password": "${{ steps.load-secrets.outputs.RENOVATE_GHCR_TOKEN }}"}]'
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ steps.version.outputs.version }}

      - name: Assert every repository finished
        # Renovate logs "Repository finished" for aborted repositories too,
        # so the gate reads each listed repository's result: a hard abort or
        # a repository missing from the log fails the run, a transient or
        # by-design result only warns. No readable log is itself a failure.
        run: |
          log="${RENOVATE_LOG_FILE}"
          if ! [ -r "${log}" ] || ! [ -s "${log}" ]; then
            echo "::error title=Renovate wrote no log::${log} is missing, empty or unreadable - Renovate never started (a broken runner pin: revert RUNNER_VERSION or dispatch with a known-good version, #1681) or RENOVATE_LOG_FILE stopped reaching the container"
            exit 1
          fi
          IFS=, read -ra fleet <<<"${RENOVATE_AUTODISCOVER_FILTER}"
          if [ "${#fleet[@]}" -eq 0 ] || [ -z "${fleet[0]}" ]; then
            echo "::error title=Renovate fleet list is empty::RENOVATE_AUTODISCOVER_FILTER must be a literal comma-separated repository list for this gate"
            exit 1
          fi
          declare -A result
          # ${res//$'\r'/}: a Windows jq emits CRLF when the step is run locally.
          while IFS=$'\t' read -r repo res; do result["${repo}"]="${res//$'\r'/}"; done \
            < <(jq -r 'select(.msg == "Repository finished") | [(.repository // "unknown"), (.result // "unknown")] | @tsv' "${log}")
          failed=() warned=()
          for repo in "${fleet[@]}"; do
            res="${result[${repo}]:-missing}"
            case "${res}" in
              done|automerged|onboarding) ;;
              # A PR merged under the run, a registry blip, a paused or
              # archived repository: the next run heals or the list needs pruning.
              repository-changed|external-host-error|rate-limit-exceeded|temporary-error|disabled*|archived|renamed|mirror|blocked|empty) warned+=("${repo}=${res}") ;;
              *) failed+=("${repo}=${res}") ;;
            esac
          done
          summary="repositories: $(( ${#fleet[@]} - ${#failed[@]} - ${#warned[@]} ))/${#fleet[@]} succeeded${warned[*]:+; warned: ${warned[*]}}${failed[*]:+; failed: ${failed[*]}}"
          echo "${summary}"
          echo "Renovate - ${summary}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "${#warned[@]}" -ne 0 ]; then
            echo "::warning title=Renovate skipped a repository::${warned[*]} - transient or by-design; prune archived or renamed repositories from RENOVATE_AUTODISCOVER_FILTER"
          fi
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error title=Renovate did not finish every repository::${failed[*]} - 'missing' means never autodiscovered (github-bot App uninstalled, repository gone) or Renovate died before reaching it; any other value is Renovate's abort reason, detailed in the Run Renovate step log"
            exit 1
          fi

      # Loaded here, not up front, so a missing item only breaks the page,
      # never the run. A canary failure is already on its PR.
      - name: Load the Pushover secrets
        if: failure() && github.event_name != 'pull_request_target'
        id: pushover
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.42.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_SERVICE_ACCOUNT_TOKEN }}
          PUSHOVER_TOKEN: op://ci/pushover/token
          PUSHOVER_USER_KEY: op://ci/pushover/user-key

      - name: Page on failure
        # Seconds instead of the gatus dead-man's ~2.5h; gatus still owns the
        # case where the schedule never runs and nothing reaches this step.
        if: failure() && github.event_name != 'pull_request_target'
        env:
          PUSHOVER_TOKEN: ${{ steps.pushover.outputs.PUSHOVER_TOKEN }}
          PUSHOVER_USER_KEY: ${{ steps.pushover.outputs.PUSHOVER_USER_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS --retry 3 --retry-all-errors https://api.pushover.net/1/messages.json --form-string "token=${PUSHOVER_TOKEN}" --form-string "user=${PUSHOVER_USER_KEY}" --form-string "title=Renovate run failed (${GITHUB_EVENT_NAME})" --form-string "message=A step failed on ${GITHUB_REF_NAME}. Read the failing step: Run Renovate red at startup or 'wrote no log' = broken runner pin; repo=result names an aborted repository." --form-string "url=${RUN_URL}" --form-string "url_title=Open the run" --form-string "priority=1" > /dev/null
          echo "paged Pushover"

      - name: Report the canary
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${JOB_STATUS}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="${state}" -f context="Renovate canary" \
            -f description="Dry run of the candidate runner: ${JOB_STATUS}" -f target_url="${RUN_URL}" --silent
