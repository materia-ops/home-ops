---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
  push:
    branches:
      - main
    paths:
      - .renovaterc.json5
      - .renovate/**.json5
  schedule:
    - cron: 20 * * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true
  repository_dispatch:
    # Fired by the source repos (raidscope, wow-panel, azerothcore-image)
    # the moment they publish a new image, so the bump PR is opened right away
    # instead of waiting up to an hour for the schedule above.
    types: [image-published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      # Job-level so the assertion step can count the fleet it expects.
      RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }},${{ github.repository_owner }}/azerothcore-image,${{ github.repository_owner }}/raidscope,${{ github.repository_owner }}/materia-core,${{ github.repository_owner }}/wow-panel,${{ github.repository_owner }}/wow-realmchat
    steps:
      - name: Load Secrets
        id: load-secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GITHUB_BOT_APP_CLIENT_ID: op://ci/github-bot/GITHUB_BOT_APP_CLIENT_ID
          GITHUB_BOT_APP_PRIVATE_KEY: op://ci/github-bot/GITHUB_BOT_APP_PRIVATE_KEY
          RENOVATE_GHCR_TOKEN: op://ci/ghcr-pull/token

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_CLIENT_ID }}
          private-key: ${{ steps.load-secrets.outputs.GITHUB_BOT_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          # workflows:write is load-bearing: the github-actions manager bumps
          # SHA-pinned actions inside .github/workflows/** (audited 2026-07-18,
          # security review #8 - do not drop without disabling that manager).
          permission-workflows: write
          # Renovate also manages the azerothcore-image source pins
          # (versions.json git-refs manager), wow-panel's npm/actions/base
          # image, raidscope's pip/actions/base image, materia-core's
          # npm/actions, and wow-realmchat's nuget/actions/Ollama pin; the
          # github-bot App must be INSTALLED on those repos or token
          # generation fails. .github is the org config repo: every fleet
          # repo extends github>materia-ops/.github//renovate/default, and
          # renovate resolves that preset with THIS token - without .github
          # in scope the fetch 404s and every repo aborts as "invalid config".
          repositories: |
            ${{ github.event.repository.name }}
            .github
            azerothcore-image
            raidscope
            materia-core
            wow-panel
            wow-realmchat

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # Renovate opens the log in append mode; never let a previous run's
      # lines satisfy the assertion on a reused runner.
      - name: Clear the Renovate log
        run: rm -f /tmp/renovate.log

      - name: Run Renovate
        uses: renovatebot/github-action@37beffda261423addd537c33f2d126df7f6ffbab # v46.2.6
        env:
          # The action bind-mounts the host /tmp into the Renovate container
          # (docker-volumes default), which is what lets the assertion step
          # read this file.
          LOG_FILE: /tmp/renovate.log
          # info is load-bearing: the assertion greps an info-level line.
          # LOG_LEVEL (the dispatch input) shapes stdout only.
          LOG_FILE_LEVEL: info
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_AUTODISCOVER: true
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
          RENOVATE_HOST_RULES: '[{"matchHost": "ghcr.io", "hostType": "docker", "username": "malpractis", "password": "${{ steps.load-secrets.outputs.RENOVATE_GHCR_TOKEN }}"}]'
        with:
          # The action's default env-regex (action.yml) plus LOG_FILE and
          # LOG_FILE_LEVEL, which it does not forward. This copy freezes the
          # default: re-copy it whenever an action bump changes it.
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|LOG_FILE|LOG_FILE_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|(?:HTTPS?|NO)_PROXY|(?:https?|no)_proxy)$'
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || '44.74.0' }}

      - name: Assert every repository finished
        # Renovate exits 0 when it dies at startup (#1681) and logs
        # "Repository finished" for aborted repositories too, so the gate
        # counts successful results against the fleet size. A missing log
        # is itself a failure: the gate must not fail open on mount or
        # env-regex drift.
        run: |
          log=/tmp/renovate.log
          if ! [ -s "${log}" ]; then
            echo "::error title=Renovate wrote no log::${log} is missing or empty - the container did not start, or LOG_FILE is no longer forwarded (compare env-regex with the action default)"
            exit 1
          fi
          expected=$(( $(tr -cd ',' <<<"${RENOVATE_AUTODISCOVER_FILTER}" | wc -c) + 1 ))
          finished=$(grep -c '"msg":"Repository finished"' "${log}" || true)
          succeeded=$(grep '"msg":"Repository finished"' "${log}" | grep -cE '"result":"(done|automerged)"' || true)
          crashed=$(grep -cE '"msg":"unhandledRejection"|"code":"ERR_MODULE_NOT_FOUND"' "${log}" || true)
          summary="repositories: ${succeeded:-0} succeeded / ${finished:-0} finished / ${expected} expected; crash markers: ${crashed:-0}"
          echo "${summary}"
          echo "Renovate - ${summary}" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${crashed:-0}" -ne 0 ]; then
            echo "::error title=Renovate crashed at startup::${summary}. The runner pin is broken - revert renovate-version in this file, or dispatch with a known-good version input (#1681)"
            exit 1
          fi
          if [ "${succeeded:-0}" -ne "${expected}" ]; then
            echo "::error title=Renovate did not finish every repository::${summary}. Read the Run Renovate step log for the aborted repository (config-validation, forbidden, bad-credentials)"
            exit 1
          fi
