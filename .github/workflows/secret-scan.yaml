---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Cancelling on main loses nothing: the newest run rescans the whole tree
# and history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret Scan - Call
    permissions:
      contents: read # the called job checks out this repo
    uses: materia-ops/.github/.github/workflows/secret-scan.yaml@47efc730e2b1694d53bf41fa99c5e0d007c00444 # main
