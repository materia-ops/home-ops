# Exceptions to the shared secret scan (.github/workflows/secret-scan.yaml): each regex must cover a whole match.

[[allowlists]]
description = "ExternalSecret remoteRef from the Bitwarden Secrets Manager era: the UUID is the id of an entry in the store, not its value"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^key: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"$''']

[[allowlists]]
description = "dnscrypt-proxy source lists: the minisign public key that verifies a downloaded resolver list"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^minisign_key = 'RW[A-Za-z0-9+/]{54}'$''']

[[allowlists]]
description = "ExternalSecret data entry for Notifiarr: the name of the environment variable written to the Secret, not a value"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''^secretKey: DN_[A-Z]+_[0-9]_API_KEY$''']

[[allowlists]]
description = "commented Authentik proxy-provider example: the value names the user attribute that holds the password"
targetRules = ["hashicorp-tf-password"]
regexTarget = "match"
regexes = ['''^basic_auth_password_attribute += "httpBasicPassword" ?$''']

[[allowlists]]
description = "Notifiarr webauth mode: the value names the trusted proxy header, it is not a credential"
targetRules = ["materia-keyword-value"]
regexTarget = "match"
regexes = ['''^DN_UI_PASSWORD: "webauth:x-authentik-username$''']

[[allowlists]]
description = "placeholder in a comment that shows how to export the token for a local run"
targetRules = ["materia-keyword-value"]
regexTarget = "match"
regexes = ['''^OP_SERVICE_ACCOUNT_TOKEN=<your-service-account-token>$''']

[[allowlists]]
description = "ExternalSecret template that re-wraps PEM armor around a key read from the store: the match is template text, no key material"
targetRules = ["private-key"]
regexTarget = "match"
regexes = ['''^-----BEGIN RSA PRIVATE KEY-----\n {10}\{\{ \.GITHUB_APP_PRIVATE_KEY \| replace "-----BEGIN RSA PRIVATE KEY-----$''']
