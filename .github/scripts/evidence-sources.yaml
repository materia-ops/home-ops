# Upstream source repo per dependency name, for upgrade_evidence.py.
# Flat `name-or-prefix: owner/repo` (GitHub) or `codeberg.org/owner/repo`;
# the longest matching prefix wins. Only needed where the Renovate body link,
# Chart.yaml sources and the ghcr.io/<owner>/<repo> pattern all miss.
# `<chart>#app` names the repo of a chart's inner application (appVersion).
