---
# yaml-language-server: $schema=https://schemas.materia.wtf/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: shelfmark
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: shelfmark
      app.kubernetes.io/name: shelfmark
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts: &http
        - ports:
            - port: "8084"
              protocol: TCP
    - fromEntities:
        - host
      toPorts: *http
  # Public traffic leaves via the Multus VPN leg, which Cilium doesn't police;
  # no world egress here means a lost VPN route drops traffic instead of leaking it.
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - cluster
    - toCIDR:
        - 192.168.0.0/16
