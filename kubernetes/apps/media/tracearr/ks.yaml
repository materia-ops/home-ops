---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tracearr
spec:
  components:
    - ../../../../components/cnpg/app
    - ../../../../components/cnpg/single-instance
    - ../../../../components/cnpg/timescaledb
    - ../../../../components/dragonfly
  dependsOn:
    - name: cnpg-operator
      namespace: database
    - name: dragonfly-operator
      namespace: database
    - name: plugin-barman-cloud
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/tracearr/app
  postBuild:
    substitute:
      APP: *app
      # headroom until the library_snapshots chunk backlog is dropped
      DB_MEMORY_LIMIT: 3Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
