---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tracearr-secret
    template:
      data:
        BETTER_AUTH_SECRET: "{{ .BETTER_AUTH_SECRET }}"
        COOKIE_SECRET: "{{ .COOKIE_SECRET }}"
        DATABASE_URL: "postgres://tracearr:{{ .DB_PASSWORD }}@postgres-tracearr-pooler.media.svc.cluster.local:5432/tracearr?sslmode=no-verify"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: tracearr
        property: better-auth-secret
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: tracearr
        property: cookie-secret
    - secretKey: DB_PASSWORD
      remoteRef:
        key: postgres-tracearr-app
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: tracearr
        property: jwt-secret
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: tracearr
        property: client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: tracearr
        property: client-secret
