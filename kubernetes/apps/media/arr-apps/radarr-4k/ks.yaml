---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr-4k
spec:
  components:
    - ../../../../../components/authentik-forward-auth
    - ../../../../../components/kopiur/backup
    - ../../../../../components/theme-park
    - ../../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/arr-apps/radarr-4k/app
  postBuild:
    substitute:
      APP: *app
      THEME_PARK_APP: radarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false