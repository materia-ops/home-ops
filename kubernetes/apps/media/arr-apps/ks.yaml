---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr-anime
spec:
  components:
    - ../../../../components/authentik-forward-auth
    - ../../../../components/kopiur/snapshot
    - ../../../../components/theme-park
    - ../../../../components/volsync
    - ../../../../components/zeroscaler
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/arr-apps/bazarr-anime
  postBuild:
    substitute:
      APP: *app
      THEME_PARK_APP: bazarr
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "14 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
