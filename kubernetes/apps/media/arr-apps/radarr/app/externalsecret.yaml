---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radarr-secret
    template:
      data:
        RADARR__AUTH__APIKEY: "{{ .RADARR_API_KEY }}"
        RADARR__AUTH__OIDCCLIENTID: "{{ .RADARR_OIDC_CLIENT_ID }}"
        RADARR__AUTH__OIDCCLIENTSECRET: "{{ .RADARR_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: radarr
