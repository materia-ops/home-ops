# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Guide-backed: profile scores, default CF groups and default CFs follow TRaSH on
# every sync, so this file holds only deviations. Origin template (2160p superset):
# https://github.com/recyclarr/config-templates/blob/master/radarr/templates/sqp/sqp-1-web-2160p.yml
radarr:
  movies:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true

    quality_definition:
      type: sqp-streaming

    quality_profiles:
      - trash_id: 90a3370d2d30cbaf08d9c23b856a12c8  # [SQP] SQP-1 WEB (1080p)
        reset_unmatched_scores:
          enabled: true
      - trash_id: e91c9adaca0231493f4af0d571b907f9  # [SQP] SQP-1 WEB (2160p)
        reset_unmatched_scores:
          enabled: true

    # select lists only non-default CFs: required and default CFs always sync
    custom_format_groups:
      add:
        - trash_id: 1616617ab3a14397a2b2321bcbda44d1  # [HDR Formats] DV Boost
        - trash_id: 47f0d69750de9e16855915fa73bb7b08  # [HDR Formats] SDR
          select:
            - 25c12f78430a3a23413652cbd1d48d77  # SDR (no WEBDL)
        - trash_id: 9337080378236ce4c0b183e35790d2a7  # [Optional] Miscellaneous
          select:
            - f700d29429c023a5734505e77daeaea7  # DV (Disk)
            - 73613461ac2cea99d52c4cd6e177ab82  # HFR
            - 11cd1db7165d6a7ad9a83bc97b8b1060  # VC-1
            - ae4cfaa9283a4f2150ac3da08e388723  # VP9
            - 2899d84dc9372de3408e6d8cc18e9666  # x264
            - 9170d55c319f4fe40da8711ba9d8050d  # x265
            - 390455c22a9cac81a738f6cbad705c3c  # x266
        - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
          select:
            - eca37840c13c6ef2dd0262b141a5482f  # 4K Remaster
            - e0c07d59beb37348e975a930d5e50319  # Criterion Collection
            - 0f12c086e289cf966fa5948eac571f44  # Hybrid
            - eecf3a857724171f968a66cb5719e152  # IMAX
            - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced
            - 9d27d9d2181838f76dee150882bdc58c  # Masters of Cinema
            - 570bc9ebecd92723d2d21500f4be314c  # Remaster
            - 957d0f44b592285f26449575e8b1167e  # Special Edition
            - e9001909a4c88013a359d0b9920d7bea  # Theatrical Cut
            - db9b4c4b53d312a3ca5f1378f6440fc9  # Vinegar Syndrome
        - trash_id: f737e18b5824d6ebb2d57b957ae2fd6c  # [Streaming Services] UK
        - trash_id: 15b1cf0b6f1a1493856a4355907affee  # [Unwanted] Unwanted Formats SQP
          select:
            - 7357cf5161efbf8c4d5d0c30b4815ee2  # Obfuscated
            - 5c44f52a8714fdd79bb4d98e2673be1f  # Retags
            - f537cf427b64c38c8e36298f657e4828  # Scene
