# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Guide-backed: profile scores, default CF groups and default CFs follow TRaSH on
# every sync, so this file holds only deviations. Origin template:
# https://github.com/recyclarr/config-templates/blob/master/sonarr/templates/web-2160p-combined.yml
sonarr:
  tv:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY

    delete_old_custom_formats: true

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true

    # select lists only non-default CFs: required and default CFs always sync
    custom_format_groups:
      add:
        - trash_id: e0b2774083df4265f25c9e5bc6c80940  # [HDR Formats] DV Boost
        - trash_id: e1053c0ef622df3749fa43c22865663a  # [HDR Formats] SDR
          select:
            - 83304f261cf516bb208c18c54c0adf97  # SDR (no WEBDL)
        - trash_id: f4a0410a1df109a66d6e47dcadcce014  # [Optional] Miscellaneous
          select:
            - ef4963043b0987f8485bc9106f16db38  # DV (Disk)
            - 1bd69272e23c5e6c5b1d6c8a36fce95e  # HFR
            - 4a20cfb76b5f92a8ca22b894b32e71be  # Multi-Episode
            - 7470a681e6205243983c4410ee4c920f  # VC-1
            - 90501962793d580d011511155c97e4e5  # VP9
            - cddfb4e32db826151d97352b8e37c648  # x264
            - c9eafd50846d299b862ca9bb6ea91950  # x265
            - 041d90b435ebd773271cea047a457a6a  # x266
        - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs
        - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a  # [Streaming Services] Asian
        - trash_id: f60f4401ce880aad62e9d21c8bb6b91a  # [Streaming Services] Dutch
        - trash_id: 848fd356c200568fc5a6248150e7e7ea  # [Streaming Services] French
        - trash_id: ddab3095a5d2f436f369263840af34f9  # [Streaming Services] UK
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - 82d40da2bc6923f41e14394075dd4b03  # No-RlsGroup
            - e1a997ddb54e3ecbfe06341ad323c458  # Obfuscated
            - 06d66ab109d4d2eddb2794d21526d140  # Retags
            - 1b3994c551cbb92a2c781af061f4ab44  # Scene

    custom_formats:
      # FLUX at its guide default score (the CF isn't part of the profile by default)
      - trash_ids:
          - 5d9fd1b1e06cd8a475462f40214b7df6  # FLUX
        assign_scores_to:
          - name: "WEB-2160p (Combined)"
            score: 51
      # Deprioritize multi-episode files (TRaSH-optional CF; score is a local preference)
      - trash_ids:
          - 4a20cfb76b5f92a8ca22b894b32e71be  # Multi-Episode
        assign_scores_to:
          - name: "WEB-2160p (Combined)"
            score: -50
