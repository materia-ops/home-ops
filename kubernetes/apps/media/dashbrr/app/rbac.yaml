---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashbrr
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dashbrr
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Discovery takes each card's link from the HTTPRoute that targets the Service.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashbrr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dashbrr
subjects:
  - kind: ServiceAccount
    name: dashbrr
    namespace: media
