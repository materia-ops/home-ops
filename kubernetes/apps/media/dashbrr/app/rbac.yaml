---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashbrr
automountServiceAccountToken: false
---
# Cluster-scoped because this Kustomization pins namespaced objects to media,
# so it cannot bind in torrents; DASHBRR__K8S_DISCOVERY_NAMESPACES limits the reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dashbrr
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Discovery takes each card's link from the HTTPRoute that targets the Service.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashbrr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dashbrr
subjects:
  - kind: ServiceAccount
    name: dashbrr
    namespace: media
