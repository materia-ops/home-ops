---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashbrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dashbrr-secret
  data:
    - secretKey: DASHBRR__OIDC_CLIENT_ID
      remoteRef:
        key: dashbrr
        property: client-id
    - secretKey: DASHBRR__OIDC_CLIENT_SECRET
      remoteRef:
        key: dashbrr
        property: client-secret
    - secretKey: DASHBRR_AUTOBRR_API_KEY
      remoteRef:
        key: dashbrr
        property: autobrr-api-key
    - secretKey: DASHBRR_EMBY_API_KEY
      remoteRef:
        key: dashbrr
        property: emby-api-key
    - secretKey: DASHBRR_PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: PROWLARR_API_KEY
    - secretKey: DASHBRR_QUI_API_KEY
      remoteRef:
        key: dashbrr
        property: qui-api-key
    - secretKey: DASHBRR_RADARR_4K_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_4K_API_KEY
    - secretKey: DASHBRR_RADARR_ANIME_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_ANIME_API_KEY
    - secretKey: DASHBRR_RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: DASHBRR_SABNZBD_API_KEY
      remoteRef:
        key: sabnzbd
        property: SABNZBD_API_KEY
    - secretKey: DASHBRR_SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
    - secretKey: DASHBRR_SONARR_ANIME_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_ANIME_API_KEY
    - secretKey: DASHBRR_SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
