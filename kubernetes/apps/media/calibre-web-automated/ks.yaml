---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web-automated
spec:
  components:
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
  interval: 30m
  path: ./kubernetes/apps/media/calibre-web-automated/app
  postBuild:
    substitute:
      APP: *app
      # No KOPIUR_PUID/PGID: the pod runs as 0/1000 with fsGroup 1000, so every
      # file on the PVC is group-1000 — the default 1000/1000 mover reads them
      # all, while a caps-less root mover is bound by the same mode bits.
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "16 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
