---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web-automated
spec:
  components:
    # Pod runs as root (s6 chowns /config to 1000), and the kopiur mover reads
    # the snapshot clone as 1000 with no fsGroup relabel (volsync's mover has
    # one) — check the first snapshot before flipping.
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
  interval: 30m
  path: ./kubernetes/apps/media/calibre-web-automated/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "16 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
