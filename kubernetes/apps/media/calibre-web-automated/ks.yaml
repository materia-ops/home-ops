---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web-automated
spec:
  components:
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
  interval: 30m
  path: ./kubernetes/apps/media/calibre-web-automated/app
  postBuild:
    substitute:
      APP: *app
      # Root mover: the pod runs as 0/1000 (s6 needs root), so the default
      # uid 1000 cannot read the clone kopiur mounts read-only. Permitted by
      # the privileged-movers annotation on the media namespace.
      KOPIUR_PGID: "1000"
      KOPIUR_PUID: "0"
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE: "16 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
