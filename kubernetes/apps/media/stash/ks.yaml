---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stash
spec:
  components:
    # - ../../../../components/gpu
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
    - ../../../../components/zeroscaler
  dependsOn:
    # - name: intel-gpu-resource-driver
    #   namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/stash/app
  postBuild:
    substitute:
      APP: *app
      # The 5Gi default cache is tight for a 50Gi first upload even with
      # kopia's cache budgets capped below the volume.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Pinned 20 min apart from plex (:00) and emby (:20) so the three 50Gi
      # apps never share the NFS backend; the default would be a hashed minute.
      KOPIUR_SCHEDULE: "40 * * * *"
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_SCHEDULE: "10 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
