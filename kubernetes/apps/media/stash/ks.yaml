---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stash
spec:
  components:
    # - ../../../../components/gpu
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
    - ../../../../components/zeroscaler
  dependsOn:
    # - name: intel-gpu-resource-driver
    #   namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/stash/app
  postBuild:
    substitute:
      APP: *app
      # kopia caps its own content+metadata caches at 3Gi; the headroom is for
      # the unbudgeted index and own-writes caches during a 50Gi first upload.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Root mover: the pod runs as 0/0, so its files are root-only and the
      # default uid 1000 cannot read the clone kopiur mounts read-only.
      # Permitted by the privileged-movers annotation on the media namespace.
      KOPIUR_PGID: "0"
      KOPIUR_PUID: "0"
      # Starts 20 min apart from plex (:00) and emby (:20) to keep the three
      # 50Gi apps' steady-state runs off each other; the default would hash
      # the minute.
      KOPIUR_SCHEDULE: "40 * * * *"
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_SCHEDULE: "10 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
