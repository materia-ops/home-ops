---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stash
spec:
  chartRef:
    kind: OCIRepository
    name: stash
  interval: 1h
  values:
    controllers:
      stash:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            nameOverride: "{{ .Release.Name }}"
            image:
              repository: docker.io/stashapp/stash
              tag: v0.31.1@sha256:df744af5a0c976e2ec671052ecc1f8a9aa757fa12b8f9930b59910b7295f0da6
            env:
              STASH_PORT: &port 80
              STASH_STASH: /data
              STASH_GENERATED: /generated
              STASH_METADATA: /metadata
              STASH_CACHE: /cache
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness: &probes
                enabled: true
                spec:
                  initialDelaySeconds: 0
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ "ALL" ] }
            resources:
              # claims:
              #   - name: gpu
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # SQLite-backed; give the DB time to flush on the zeroscaler's SIGTERM
      # instead of the 30s default that risks corruption mid-write.
      terminationGracePeriodSeconds: 300
      # resourceClaims:
      #   - name: gpu
      #     resourceClaimTemplateName: stash-gpu
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        # Always, not the fleet-default OnRootMismatch: the blob store carries
        # directories that predate this deployment at mode 2755, and the
        # container is root with all capabilities dropped, so it has no
        # DAC_OVERRIDE to write past a missing group-write bit. OnRootMismatch
        # only ever looked at the volume root, which already matched. The
        # recursive pass is cheap here (~6k files) even with the zeroscaler.
        fsGroupChangePolicy: Always
        seccompProfile: { type: RuntimeDefault }
        supplementalGroups: [ 44, 226 ]
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.materia.wtf"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      app-data:
        existingClaim: stash
        advancedMounts:
          stash:
            app:
              - path: /root/.stash
                subPath: config
              - path: /blobs
                subPath: blobs
              - path: /cache
                subPath: cache
              - path: /generated
                subPath: generated
              - path: /metadata
                subPath: metadata
      data:
        type: nfs
        server: nas.internal
        path: /mnt/tank/data/stash
        globalMounts:
          - path: /data
      dev-dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        globalMounts:
          - path: /dev/dri
