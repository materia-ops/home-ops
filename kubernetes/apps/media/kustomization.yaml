---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

components:
  - ../../components/alerts
  - ../../components/kopiur/secret
  - ../../components/namespace

patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/labels
        value:
          resource.kubernetes.io/admin-access: "true"

resources:
  - ./arr-apps
  - ./calibre-web-automated/ks.yaml
  - ./emby/ks.yaml
  - ./flaresolverr/ks.yaml
  - ./notifiarr/ks.yaml
  - ./plex/ks.yaml
  - ./sabnzbd/ks.yaml
  - ./seerr/ks.yaml
  - ./shelfmark/ks.yaml
  - ./stash/ks.yaml
  - ./tautulli/ks.yaml
