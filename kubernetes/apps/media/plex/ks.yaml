---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  components:
    - ../../../../components/gpu
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
    - ../../../../components/zeroscaler
  dependsOn:
    - name: intel-gpu-resource-driver
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 30m
  path: ./kubernetes/apps/media/plex/plex
  postBuild:
    substitute:
      APP: *app
      # kopia caps its own content+metadata caches at 3Gi; the headroom is for
      # the unbudgeted index and own-writes caches during a 50Gi first upload.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Starts 20 min apart from emby (:20) and stash (:40) to keep the three
      # 50Gi apps' steady-state runs off each other (the default hashes the
      # minute). Coincides with VOLSYNC_SCHEDULE below until plex flips.
      KOPIUR_SCHEDULE: "0 * * * *"
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_SCHEDULE: "0 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tautulli
spec:
  components:
    - ../../../../components/kopiur/snapshot
    - ../../../../components/volsync
  dependsOn:
    - name: plex
      namespace: media
  interval: 30m
  path: ./kubernetes/apps/media/plex/tautulli
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE: "42 * * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: true
