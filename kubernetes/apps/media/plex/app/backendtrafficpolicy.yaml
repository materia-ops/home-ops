---
# yaml-language-server: $schema=https://schemas.materia.wtf/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      connectionIdleTimeout: 300s
---
# yaml-language-server: $schema=https://schemas.materia.wtf/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex-events
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex
      # requestBuffer hangs WebSocket upgrades: this rule-level policy replaces
      # the route-level one for the events rule without it.
      sectionName: events
  timeout:
    http:
      connectionIdleTimeout: 300s
