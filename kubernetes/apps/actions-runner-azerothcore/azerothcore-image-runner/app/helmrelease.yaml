---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name azerothcore-image-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/materia-ops/azerothcore-image
    githubConfigSecret: azerothcore-image-runner-secret
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    # The compile runs inside buildkitd. The workflow's BUILD_JOBS=4 matches its
    # CPU limit of 5 (nproc in the container reports host cores).
    template:
      spec:
        # Builds run PR code: the pod must not carry a Kubernetes API credential.
        automountServiceAccountToken: false
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
            # Don't take a job until buildkitd is listening, for up to 120s.
            command:
              [
                "bash",
                "-c",
                "for _ in {1..120}; do (exec 3<>/dev/tcp/127.0.0.1/1234) 2>/dev/null && break; sleep 1; done; exec /home/runner/run.sh",
              ]
            env:
              - name: TZ
                value: Australia/Melbourne
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
          - name: buildkitd
            image: docker.io/moby/buildkit:v0.35.0-rootless@sha256:5987568f92dafbfb679879de59c1cd8d26597f5f6635c314e166164e2615870c
            args:
              - --addr=tcp://127.0.0.1:1234
              # Masked /proc in an unprivileged pod blocks the process sandbox.
              - --oci-worker-no-process-sandbox
            securityContext:
              runAsGroup: 1000
              runAsUser: 1000
              seccompProfile:
                type: Unconfined
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "5"
                memory: 12Gi
            volumeMounts:
              - name: buildkit-state
                mountPath: /home/user/.local/share/buildkit
        volumes:
          - name: buildkit-state
            emptyDir:
              sizeLimit: 80Gi
          - name: work
            emptyDir:
              sizeLimit: 10Gi
