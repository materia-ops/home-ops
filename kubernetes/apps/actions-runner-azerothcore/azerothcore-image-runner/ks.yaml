---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: azerothcore-image-runner
spec:
  dependsOn:
    - name: actions-runner-controller
      namespace: actions-runner-system
  interval: 1h
  path: ./kubernetes/apps/actions-runner-azerothcore/azerothcore-image-runner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actions-runner-azerothcore
  wait: false
