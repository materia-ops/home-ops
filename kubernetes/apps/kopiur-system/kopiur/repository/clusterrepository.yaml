---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: materia
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /mnt/apps/kopiur
          server: nas.internal
  concurrency:
    maxConcurrentJobs: 3
  encryption:
    passwordSecretRef:
      name: kopiur-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      full:
        cron: 0 2 * * *
        jitter: 30m
      quick:
        cron: H * * * *
  moverDefaults:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    jitter: 10m
    timezone: Australia/Melbourne
