---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: materia
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /mnt/apps/kopiur
          server: nas.internal
  # one mover pool for every namespace: bounds the NFS backend
  concurrency:
    maxConcurrentJobs: 3
  # movers read this Secret from their own namespace: every namespace with a
  # backup needs components/kopiur/secret mixed in
  encryption:
    passwordSecretRef:
      name: kopiur-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # the override needs both entries; full starts by 02:30 so it clears the
  # 03:00 verification window and the azerothcore-db dump
  maintenance:
    schedule:
      full:
        cron: 0 2 * * *
        jitter: 30m
      quick:
        cron: H * * * *
  # the share is owned 1000:1000 and fsGroup is a no-op on NFS, so the mover
  # uid/gid must match it
  moverDefaults:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  # hourly policies need hourly epochs or index blobs pile past the 1000
  # threshold; 1h is the floor for the default 20m refresh (refresh x3 <= this)
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    jitter: 10m
    timezone: Australia/Melbourne
