---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: materia
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          path: /mnt/apps/kopiur
          server: nas.internal
  # one mover pool for every namespace: bounds the NFS backend
  concurrency:
    maxConcurrentJobs: 3
  # movers read this Secret from their own namespace: every namespace with a
  # backup needs components/kopiur/secret mixed in
  encryption:
    passwordSecretRef:
      name: kopiur-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # the share is owned 1000:1000 and fsGroup is a no-op on NFS, so the mover
  # uid/gid must match it
  moverDefaults:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
  scheduleDefaults:
    jitter: 10m
    timezone: Australia/Melbourne
