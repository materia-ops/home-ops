---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  install:
    crds: CreateReplace
  interval: 1h
  upgrade:
    # The home-operations chart ships CRDs in crds/ instead of templates/;
    # CreateReplace keeps them updated on chart bumps (Flux default is None).
    crds: CreateReplace
  values:
    monitoring:
      serviceMonitor:
        enabled: true
