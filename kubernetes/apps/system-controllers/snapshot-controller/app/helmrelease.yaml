---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  interval: 1h
  postRenderers:
    # One-time migration prep: bake helm.sh/resource-policy=keep into the
    # stored release manifest so the next chart swap (piraeus ->
    # home-operations, which moves CRDs out of templates/) cannot delete the
    # snapshot CRDs and cascade-delete every VolumeSnapshot on the cluster.
    - kustomize:
        patches:
          - patch: |
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: any
                annotations:
                  helm.sh/resource-policy: keep
            target:
              kind: CustomResourceDefinition
  values:
    monitoring:
      serviceMonitor:
        enabled: true
