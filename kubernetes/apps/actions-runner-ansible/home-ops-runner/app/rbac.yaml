---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-ops-runner
---
# The documented permission set for ARC kubernetes containerMode; the runner
# needs no other Kubernetes access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-ops-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-ops-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-ops-runner
subjects:
  - kind: ServiceAccount
    name: home-ops-runner
    namespace: actions-runner-ansible
