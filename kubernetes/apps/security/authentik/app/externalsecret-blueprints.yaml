---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authentik-blueprint-secrets
  data:
    # autobrr OIDC provider
    - secretKey: AUTOBRR_CLIENT_ID
      remoteRef:
        key: autobrr
        property: client-id
    - secretKey: AUTOBRR_CLIENT_SECRET
      remoteRef:
        key: autobrr
        property: client-secret
    # Calibre-Web-Automated OIDC provider
    - secretKey: CALIBRE_CLIENT_ID
      remoteRef:
        key: calibre
        property: client-id
    - secretKey: CALIBRE_CLIENT_SECRET
      remoteRef:
        key: calibre
        property: client-secret
    # Discord OAuth source
    - secretKey: DISCORD_CLIENT_ID
      remoteRef:
        key: discord-oauth
        property: client-id
    - secretKey: DISCORD_CLIENT_SECRET
      remoteRef:
        key: discord-oauth
        property: client-secret
    # Flux Operator OIDC provider
    - secretKey: FLUX_CLIENT_ID
      remoteRef:
        key: flux-operator
        property: client-id
    - secretKey: FLUX_CLIENT_SECRET
      remoteRef:
        key: flux-operator
        property: client-secret
    # GitHub OAuth source
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: github-oauth
        property: client-id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: github-oauth
        property: client-secret
    # Google OAuth source
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: google-oauth
        property: client-id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: google-oauth
        property: client-secret
    # Grafana OIDC provider
    - secretKey: GRAFANA_CLIENT_ID
      remoteRef:
        key: grafana
        property: client-id
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef:
        key: grafana
        property: client-secret
    # Notifiarr - Authentik events -> Discord (dedicated authentik integration API key)
    - secretKey: NOTIFIARR_API_KEY
      remoteRef:
        key: notifiarr
        property: AUTHENTIK_API_KEY
    # Plex source
    - secretKey: PLEX_CLIENT_ID
      remoteRef:
        key: plex-oauth
        property: client-id
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex-oauth
        property: token
    # qui OIDC provider
    - secretKey: QUI_CLIENT_ID
      remoteRef:
        key: qui
        property: client-id
    - secretKey: QUI_CLIENT_SECRET
      remoteRef:
        key: qui
        property: client-secret
    # Seerr OIDC provider
    - secretKey: SEERR_CLIENT_ID
      remoteRef:
        key: seerr
        property: client-id
    - secretKey: SEERR_CLIENT_SECRET
      remoteRef:
        key: seerr
        property: client-secret
    # Raidscope OIDC provider
    - secretKey: RAIDSCOPE_CLIENT_ID
      remoteRef:
        key: raidscope
        property: client-id
    - secretKey: RAIDSCOPE_CLIENT_SECRET
      remoteRef:
        key: raidscope
        property: client-secret
    # Shelfmark OIDC provider
    - secretKey: SHELFMARK_CLIENT_ID
      remoteRef:
        key: shelfmark
        property: client-id
    - secretKey: SHELFMARK_CLIENT_SECRET
      remoteRef:
        key: shelfmark
        property: client-secret
    # Sonarr Anime OIDC provider
    - secretKey: SONARR_ANIME_CLIENT_ID
      remoteRef:
        key: sonarr
        property: SONARR_ANIME_OIDC_CLIENT_ID
    - secretKey: SONARR_ANIME_CLIENT_SECRET
      remoteRef:
        key: sonarr
        property: SONARR_ANIME_OIDC_CLIENT_SECRET
    # Sonarr OIDC provider
    - secretKey: SONARR_CLIENT_ID
      remoteRef:
        key: sonarr
        property: SONARR_OIDC_CLIENT_ID
    - secretKey: SONARR_CLIENT_SECRET
      remoteRef:
        key: sonarr
        property: SONARR_OIDC_CLIENT_SECRET
    # Tracearr OIDC provider
    - secretKey: TRACEARR_CLIENT_ID
      remoteRef:
        key: tracearr
        property: client-id
    - secretKey: TRACEARR_CLIENT_SECRET
      remoteRef:
        key: tracearr
        property: client-secret
    # TrueNAS OIDC provider
    - secretKey: TRUENAS_CLIENT_ID
      remoteRef:
        key: truenas
        property: client-id
    - secretKey: TRUENAS_CLIENT_SECRET
      remoteRef:
        key: truenas
        property: client-secret
    # Cloudflare Turnstile - captcha stage
    - secretKey: TURNSTILE_SITE_KEY
      remoteRef:
        key: cloudflare-turnstile
        property: site-key
    - secretKey: TURNSTILE_SECRET_KEY
      remoteRef:
        key: cloudflare-turnstile
        property: secret-key
