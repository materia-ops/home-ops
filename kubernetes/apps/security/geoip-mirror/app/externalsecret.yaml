---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geoip-mirror
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: geoip-mirror-secret
    template:
      data:
        GEOIPUPDATE_ACCOUNT_ID: "{{ .GEOIPUPDATE_ACCOUNT_ID }}"
        GEOIPUPDATE_LICENSE_KEY: "{{ .GEOIPUPDATE_LICENSE_KEY }}"
  dataFrom:
    - extract:
        key: geoip-mirror
