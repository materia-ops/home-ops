---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: geoip-mirror
spec:
  chartRef:
    kind: OCIRepository
    name: geoip-mirror
  interval: 1h
  values:
    controllers:
      geoip-mirror:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO PVC: never two pods at once
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
          geoipupdate:
            image:
              repository: ghcr.io/maxmind/geoipupdate
              tag: v7.1.1@sha256:faecdca22579730ab0b7dea5aa9af350bb3c93cb9d39845c173639ead30346d2
            # The image's entrypoint exits on any failure (a 429 crashlooped
            # authentik's sidecars); this loop logs and retries instead. Unchanged
            # DBs are md5-checked against MaxMind and don't count against the limit.
            command: ["/bin/sh", "-c"]
            args:
              - |
                trap 'exit 0' TERM
                while true; do
                  if /usr/bin/geoipupdate -v; then wait=43200; else echo "geoipupdate failed; retrying in 6h"; wait=21600; fi
                  sleep "$wait" & wait $!
                done
            env:
              GEOIPUPDATE_CONF_FILE: ""
              GEOIPUPDATE_DB_DIR: /usr/share/GeoIP
              GEOIPUPDATE_EDITION_IDS: GeoLite2-ASN GeoLite2-City
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      # Re-downloadable cache: deliberately not backed up by kopiur.
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          geoip-mirror:
            app:
              - path: /usr/share/nginx/html
                readOnly: true
            geoipupdate:
              - path: /usr/share/GeoIP
      tmp:
        type: emptyDir
        advancedMounts:
          geoip-mirror:
            app:
              - path: /tmp
