---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        kubernetes: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-vault-secret
            namespace: security
            key: OP_CONNECT_TOKEN
---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/clustersecretstore_v1.json
# The pihole vault is shared with CI's service account (Ansible); its own store keeps
# a token without access to it from breaking every other ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-pihole
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        pihole: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-vault-secret
            namespace: security
            key: OP_CONNECT_TOKEN
