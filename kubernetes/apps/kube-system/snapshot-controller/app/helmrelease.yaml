---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  # stateless: retry a failed install instead of holding
  install:
    remediation:
      retries: 3
  interval: 1h
  values:
    # leader election is on in the chart, so two replicas fail over cleanly
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
