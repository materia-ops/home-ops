---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  chartRef:
    kind: OCIRepository
    name: k8tz
  # stateless: retry a failed install instead of holding
  install:
    remediation:
      retries: 3
  interval: 1h
  values:
    # let the chart use the release namespace instead of templating its own Namespace
    namespace: null
    createNamespace: false
    replicaCount: 2
    timezone: Australia/Melbourne
    cronJobTimeZone: true
    webhook:
      # stable cert via cert-manager; the chart's default regenerates it on every upgrade
      certManager:
        enabled: true
        issuerRef:
          kind: Issuer
          name: k8tz-webhook-issuer
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8tz
              topologyKey: kubernetes.io/hostname
