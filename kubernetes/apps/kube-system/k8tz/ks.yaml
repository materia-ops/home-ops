---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8tz
spec:
  dependsOn:
    - name: cert-manager
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/kube-system/k8tz/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  wait: false
