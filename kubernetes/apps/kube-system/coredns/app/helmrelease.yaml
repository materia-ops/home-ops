---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    priorityClassName: system-cluster-critical
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.43.0.10
    replicaCount: 2
    servers:
      # Local split-horizon names (*.internal) and LAN reverse DNS stay on the
      # Pi-holes — they hold those records; NextDNS doesn't.
      - zones:
          - zone: internal
            scheme: dns://
          - zone: 168.192.in-addr.arpa
            scheme: dns://
        port: 53
        plugins:
          - name: errors
          - name: cache
            parameters: "30"
          - name: forward
            parameters: . 192.168.1.2 192.168.20.2
          - name: loop
          - name: reload
      # Cluster (cluster.local) + everything else. External queries go to the
      # in-cluster dnscrypt VIP, which uses the dedicated NextDNS "kubernetes"
      # profile — separate from the home profile the Pi-holes use.
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          # Pod/service CIDRs are v4-only, so AAAA answers are unusable in-pod;
          # an authoritative empty answer stops the resolver's AAAA round-trips.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              authority "{{ .Zone }} 60 IN SOA ns.dns.cluster.local. hostmaster.cluster.local. (1 60 60 60 60)"
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          # autopath is INCOMPATIBLE with Cilium toFQDNs policies: it answers
          # search-suffixed queries (name.<ns>.svc.cluster.local.) with the
          # public record, so the DNS proxy keys the IP to a name no matchName
          # matches and traffic is policy-dropped (took ARC down, 2026-07-18).
          # Any pod selected by a toFQDNs policy MUST set dnsConfig ndots:1 so
          # its external lookups bypass the search path — see the runner scale
          # sets. Do not add a toFQDNs policy without that override.
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . 192.168.10.2
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
              servfail 0
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
