---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crd-schema-publisher-rules
spec:
  groups:
    - name: crd-schema-publisher.rules
      rules:
        - alert: CRDPublisherPublishLoop
          expr: |-
            sum(increase(crdpublisher_publish_cycle_total[1h])) > 20
          for: 1h
          annotations:
            summary: >-
              crd-schema-publisher ran {{ $value | humanize }} publish cycles in the last hour; a CRD is
              being rewritten in a loop (look for one stuck Terminating)
          labels:
            severity: warning

        - alert: CRDStatusWriteLoop
          expr: |-
            sum(increase(apiserver_request_total{job="apiserver", resource="customresourcedefinitions", subresource="status", verb!~"GET|LIST|WATCH"}[30m])) > 30
          for: 1h
          annotations:
            summary: >-
              The apiserver rewrote CRD status {{ $value | humanize }} times in 30 minutes; a CRD is
              likely stuck Terminating behind instances that still hold finalizers
          labels:
            severity: warning
