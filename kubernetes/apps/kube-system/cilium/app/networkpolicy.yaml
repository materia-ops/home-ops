---
# yaml-language-server: $schema=https://schemas.materia.wtf/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Only the Pi-hole API consumers may reach the Pis' web UI/API (DNS untouched).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: pihole-api
# Two rules: one selector can't say "not (network AND consumer)". Pods can't fake the namespace label.
specs:
  - description: Deny the Pi-hole web UI/API to pods outside network
    endpointSelector:
      matchExpressions:
        - { key: io.kubernetes.pod.namespace, operator: NotIn, values: ["network"] }
    enableDefaultDeny: &noDefaultDeny
      egress: false
      ingress: false
    egressDeny: &piholeApi
      - toCIDR:
          - 192.168.1.2/32 # pi-0
          - 192.168.20.2/32 # pi-1
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP
              - port: "443"
                protocol: TCP
  - description: Deny the Pi-hole web UI/API to network pods that don't consume it
    endpointSelector:
      matchLabels:
        io.kubernetes.pod.namespace: network
      matchExpressions:
        - { key: app.kubernetes.io/instance, operator: NotIn, values: ["external-dns-pihole"] }
        - { key: app.kubernetes.io/name, operator: NotIn, values: ["pihole-nebula-sync"] }
        - {
            key: gateway.envoyproxy.io/owning-gateway-name,
            operator: NotIn,
            values: ["envoy-internal"],
          }
    enableDefaultDeny: *noDefaultDeny
    egressDeny: *piholeApi
