---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-cleanup-operator
spec:
  chart:
    spec:
      chart: kube-cleanup-operator
      version: 1.0.4
      sourceRef:
        kind: HelmRepository
        name: lwolf-charts
        namespace: system
      interval: 15m
  # namespace move: the old release's cluster-scoped objects can still exist
  # when this one first installs; retry instead of fail-and-hold
  install:
    remediation:
      retries: 3
  interval: 15m
  values:
    securityContext:
      runAsUser: 65534 # run as nobody user
    containerSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    rbac:
      create: true
      global: true
    args:
      - --delete-failed-after=0
      - --delete-successful-after=0
      - --delete-pending-pods-after=3m
      - --delete-evicted-pods-after=3m
      - --delete-orphaned-pods-after=3m
      - --legacy-mode=false
