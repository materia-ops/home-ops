---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
# The chart's two [2d]-lookback trend rules, disabled there (prometheusRuleOverrides
# in ./helmrelease.yaml) and re-homed here: its per-rule overrides cannot set a group
# interval. Upstream: rook deploy/charts/rook-ceph-cluster/prometheus/localrules.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  groups:
    - name: "nodes trend"
      # A 2d linear extrapolation cannot change meaningfully between 20s default evals.
      interval: 5m
      rules:
        # Deviation from upstream: free bytes merged per (cluster,instance,mountpoint)
        # before the [2d] fit. A node-exporter restart or NVMe re-enumeration (new pod
        # or device label) starts a fresh series, and a fit on minutes of data false-fires.
        - alert: "CephNodeDiskspaceWarning"
          annotations:
            description: "Mountpoint {{ $labels.mountpoint }} on {{ $labels.nodename }} will be full in less than 5 days based on the 48 hour trailing fill rate."
            summary: "Host filesystem free space is getting low on cluster {{ $labels.cluster }}"
          expr: 'predict_linear(max by (cluster, instance, mountpoint) (node_filesystem_free_bytes{device=~"/.*"})[2d:5m], 3600 * 24 * 5) * on(cluster, instance) group_left(nodename) max by (cluster, instance, nodename) (node_uname_info) < 0'
          labels:
            oid: "1.3.6.1.4.1.50495.1.2.1.8.4"
            severity: "warning"
            type: "ceph_default"
    - name: "pools trend"
      interval: 5m
      rules:
        # Deviation from upstream: both sides are max by (cluster,pool_id). A mgr
        # failover leaves old+new pod series in the [2d] lookback, the join goes
        # many-to-many and vmsingle rejects the rule (rook#10691).
        - alert: "CephPoolGrowthWarning"
          annotations:
            description: "Pool '{{ $labels.name }}' will be full in less than 5 days assuming the average fill-up rate of the past 48 hours."
            summary: "Pool growth rate may soon exceed capacity on cluster {{ $labels.cluster }}"
          # Deviation: >= 0.95, not upstream's >= 95. ceph_pool_percent_used is a
          # 0-1 ratio, so >= 95 can never fire.
          expr: |
            (
              predict_linear(max by (cluster, pool_id) (ceph_pool_percent_used)[2d:10m], 3600 * 24 * 5)
              * on(cluster,pool_id) group_right()
              max by (cluster, pool_id, name) (ceph_pool_metadata)
            ) >= 0.95
          labels:
            oid: "1.3.6.1.4.1.50495.1.2.1.9.2"
            severity: "warning"
            type: "ceph_default"
