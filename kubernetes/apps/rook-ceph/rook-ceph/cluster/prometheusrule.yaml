---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
# Companion to the chart's shipped PrometheusRule: the two [2d]-lookback trend
# rules are disabled there (monitoring.prometheusRuleOverrides in
# ./helmrelease.yaml) and re-homed here, because the chart's per-rule override
# mechanism cannot set a group-level eval interval. A 2d linear extrapolation
# cannot change meaningfully between 20s default evals; 5m is plenty.
#
# Deviations from upstream (rook deploy/charts/rook-ceph-cluster/prometheus/localrules.yaml):
#   - CephPoolGrowthWarning: upstream's on(cluster,pool_id,instance) join goes
#     many-to-many when mgr failover leaves old+new pod series (same
#     honor_labels instance) inside the [2d] lookback, and vmsingle rejects
#     the rule (rook#10691). Deduped both sides via max by (cluster,pool_id).
#     Threshold >= 0.95, not upstream's >= 95: ceph_pool_percent_used is a
#     0-1 ratio (used/(used+avail), capped at 1.0), so >= 95 can never fire.
#   - CephNodeDiskspaceWarning: verbatim; re-homed only for the interval.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  groups:
    - name: "nodes trend"
      interval: 5m
      rules:
        - alert: "CephNodeDiskspaceWarning"
          annotations:
            description: "Mountpoint {{ $labels.mountpoint }} on {{ $labels.nodename }} will be full in less than 5 days based on the 48 hour trailing fill rate."
            summary: "Host filesystem free space is getting low on cluster {{ $labels.cluster }}"
          expr: "predict_linear(node_filesystem_free_bytes{device=~\"/.*\"}[2d], 3600 * 24 * 5) * on(cluster, instance) group_left(nodename) node_uname_info < 0"
          labels:
            oid: "1.3.6.1.4.1.50495.1.2.1.8.4"
            severity: "warning"
            type: "ceph_default"
    - name: "pools trend"
      interval: 5m
      rules:
        - alert: "CephPoolGrowthWarning"
          annotations:
            description: "Pool '{{ $labels.name }}' will be full in less than 5 days assuming the average fill-up rate of the past 48 hours."
            summary: "Pool growth rate may soon exceed capacity on cluster {{ $labels.cluster }}"
          # deviation: dedupe mgr-failover series; 0-1 ratio threshold (see header)
          expr: |
            (
              predict_linear(max by (cluster, pool_id) (ceph_pool_percent_used)[2d:10m], 3600 * 24 * 5)
              * on(cluster,pool_id) group_right()
              max by (cluster, pool_id, name) (ceph_pool_metadata)
            ) >= 0.95
          labels:
            oid: "1.3.6.1.4.1.50495.1.2.1.9.2"
            severity: "warning"
            type: "ceph_default"
