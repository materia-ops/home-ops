---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 10m
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      # per-rule tweaks to the chart's shipped PrometheusRule; disabled rules
      # match nothing this cluster runs, except the two [2d] trend rules which
      # are re-homed with eval intervals in ./prometheusrule.yaml
      prometheusRuleOverrides:
        # cephadm-only certificate checks — never emitted under rook
        CephCertificateError:
          disabled: true
        CephCertificateWarning:
          disabled: true
        # no CephFS on this cluster (cephFileSystems: [])
        CephFilesystemDamaged:
          disabled: true
        CephFilesystemDegraded:
          disabled: true
        CephFilesystemFailureNoStandby:
          disabled: true
        CephFilesystemInsufficientStandby:
          disabled: true
        CephFilesystemMDSRanksLow:
          disabled: true
        CephFilesystemOffline:
          disabled: true
        CephFilesystemReadOnly:
          disabled: true
        # upstream's up{job="ceph"} matches nothing under rook (the chart
        # adapts only PrometheusJobMissing to the rook-ceph-mgr job)
        CephMgrPrometheusModuleInactive:
          expr: 'up{job="rook-ceph-mgr"} == 0'
        # [2d] trend rules re-homed in ./prometheusrule.yaml (growth rule
        # fixed there — many-to-many mgr-failover join, rook#10691)
        CephNodeDiskspaceWarning:
          disabled: true
        CephPoolGrowthWarning:
          disabled: true
        # no RBD mirroring on this cluster
        CephRBDMirrorImagesNotInSync:
          disabled: true
        CephRBDMirrorImagesNotInSyncVeryHigh:
          disabled: true
        CephRBDMirrorImagesPerDaemonHigh:
          disabled: true
        CephRBDMirrorImageTransferBandwidthHigh:
          disabled: true
        # no NVMe-oF gateways on this cluster
        NVMeoFGatewayOpenSecurity:
          disabled: true
        NVMeoFHighClientCount:
          disabled: true
        NVMeoFHighGatewayCPU:
          disabled: true
        NVMeoFHighHostCPU:
          disabled: true
        NVMeoFHighReadLatency:
          disabled: true
        NVMeoFHighWriteLatency:
          disabled: true
        NVMeoFHostKeepAliveTimeout:
          disabled: true
        NVMeoFInterfaceDown:
          disabled: true
        NVMeoFInterfaceDuplex:
          disabled: true
        NVMeoFMaxGatewayGroups:
          disabled: true
        NVMeoFMaxGatewayGroupSize:
          disabled: true
        NVMeoFMissingListener:
          disabled: true
        NVMeoFMultipleNamespacesOfRBDImage:
          disabled: true
        NVMeoFSingleGateway:
          disabled: true
        NVMeoFSubsystemNamespaceLimit:
          disabled: true
        NVMeoFTooManyGateways:
          disabled: true
        NVMeoFTooManyNamespaces:
          disabled: true
        NVMeoFTooManySubsystems:
          disabled: true
        NVMeoFVersionMismatch:
          disabled: true
        NVMeoFZeroListenerSubsystem:
          disabled: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.materia.wtf
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephClusterSpec:
      cephConfig:
        global:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          device_failure_prediction_mode: local
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: true
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://vmsingle-victoria-metrics.o11y.svc.cluster.local:8428
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      network:
        provider: host
        connections:
          requireMsgr2: true
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      storage:
        useAllNodes: true
        useAllDevices: false
        devicePathFilter: /dev/disk/by-id/nvme-Micron_7450_MTFDKBA960TFR_.*
        config:
          deviceClass: nvme
          osdsPerDevice: "1"
      resources:
        mgr:
          limits:
            memory: 1Gi # default
          requests:
            cpu: 500m # 500m is default
            memory: 768Mi #512Mi is default
        mon:
          limits:
            memory: 2Gi # default
          requests:
            cpu: 500m # 1000m is default
            memory: 1Gi # 1Gi is default
        osd:
          limits:
            memory: 4Gi # default
          requests:
            cpu: 500m # 1000m is default
            memory: 1Gi # 4Gi is default
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - discard
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
    cephFileSystems: []
