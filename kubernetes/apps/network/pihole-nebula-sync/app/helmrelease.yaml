---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pihole-nebula-sync
  namespace: network
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pihole-nebula-sync
  values:
    defaultPodOptions:
      priorityClassName: system-cluster-critical
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      *app :
        # k8s CronJob instead of a long-running daemon with an internal cron:
        # a hung or failed sync now surfaces as a failed Job
        # (kube_job_status_failed) instead of silently wedging and letting the
        # two Pi-holes drift apart. (No reloader annotation — each Job run reads
        # fresh config/secret, so it's a no-op on a CronJob.)
        type: cronjob
        cronjob:
          schedule: "*/10 * * * *"
          timeZone: Australia/Melbourne
          concurrencyPolicy: Forbid
          backoffLimit: 2
          successfulJobsHistory: 1
          failedJobsHistory: 3
        pod:
          restartPolicy: OnFailure
        containers:
          *app :
            image:
              repository: ghcr.io/lovelaze/nebula-sync
              tag: v0.11.3@sha256:59c51378460f6dc8707cc91a16aa62dff5cd5dd8b39353658b45cb00d6bfddd8
            env:
              FULL_SYNC: "false"
              RUN_GRAVITY: "false"
              # No CRON var: the k8s CronJob owns the schedule; with CRON unset
              # nebula-sync runs a single sync and exits, which is what makes the
              # Job success/failure meaningful.
              CLIENT_SKIP_TLS_VERIFICATION: "true"
              TZ: Australia/Melbourne
              SYNC_CONFIG_DNS: "true"
              SYNC_CONFIG_DHCP: "false"
              SYNC_CONFIG_NTP: "true"
              SYNC_CONFIG_RESOLVER: "true"
              SYNC_CONFIG_DATABASE: "false"
              SYNC_CONFIG_MISC: "true"
              SYNC_CONFIG_DEBUG: "true"
              SYNC_GRAVITY_DHCP_LEASES: "false"
              SYNC_GRAVITY_GROUP: "false"
              SYNC_GRAVITY_AD_LIST: "true"
              SYNC_GRAVITY_AD_LIST_BY_GROUP: "true"
              SYNC_GRAVITY_DOMAIN_LIST: "true"
              SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP: "true"
              SYNC_GRAVITY_CLIENT: "false"
              SYNC_GRAVITY_CLIENT_BY_GROUP: "false"
              API_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
