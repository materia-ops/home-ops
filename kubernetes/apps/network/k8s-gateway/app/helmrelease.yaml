---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  # Stateless leaf service (no DB/schema/CRD/datapath state): safe to
  # auto-rollback a failed upgrade. Opts into rollback because the global
  # default is now fail-and-hold (flux/cluster/ks.yaml).
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    fullnameOverride: k8s-gateway
    image:
      repository: codeberg.org/k8s-gateway/k8s_gateway
      tag: 1.9.2
    deployment:
      dnsPolicy: ClusterFirst
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: null
        memory: 128Mi
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: 192.168.10.4
      externalTrafficPolicy: Cluster
    servers:
      - zones:
          - zone: .
        port: 1053
        servicePort: 53
        plugins:
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: materia.wtf
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute Service
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: loop
          - name: reload
          - name: loadbalance
