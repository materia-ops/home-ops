---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns-rules
spec:
  groups:
    - name: external-dns.rules
      rules:
        # Covers every external-dns instance (cloudflare, pihole, unifi); the
        # cloudflare one is split out so InternetDown can inhibit it.
        - alert: ExternalDNSStale
          expr: |-
            time() - external_dns_controller_last_sync_timestamp_seconds{job!="external-dns-cloudflare"} > 60
          for: 5m
          annotations:
            summary: >-
              ExternalDNS ({{ $labels.job }}) has not synced successfully in the last five minutes
          labels:
            severity: critical

        - alert: ExternalDNSStale
          expr: |-
            time() - external_dns_controller_last_sync_timestamp_seconds{job="external-dns-cloudflare"} > 60
          for: 5m
          annotations:
            summary: >-
              ExternalDNS ({{ $labels.job }}) has not synced successfully in the last five minutes
          labels:
            depends_on: internet
            severity: critical
