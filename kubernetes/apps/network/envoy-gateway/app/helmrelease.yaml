---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
          # 1.9.0 disables Lua EnvoyExtensionPolicies by default; the
          # theme-park component (arr-apps, sabnzbd, qbittorrent) is Lua.
          enableLua: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
