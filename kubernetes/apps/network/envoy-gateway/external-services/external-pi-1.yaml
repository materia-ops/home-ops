---
# yaml-language-server: $schema=https://schemas.materia.wtf/gateway.envoyproxy.io/backend_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: pi-1
  namespace: network
spec:
  endpoints:
    - fqdn:
        hostname: pi-1.internal
        port: 80
---
# yaml-language-server: $schema=https://schemas.materia.wtf/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-pi-1
  namespace: network
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - pi-1.materia.wtf
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Pi-hole FTL 6.8+ 403s the web UI for Host names it doesn't know
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: pi-1.internal
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: pi-1
          port: 80
