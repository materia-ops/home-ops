---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: internal-truenas
  namespace: network
  labels:
    kubernetes.io/service-name: internal-truenas
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.20.22
ports:
  - port: 443
    name: https
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: internal-truenas
  namespace: network
spec:
  type: ClusterIP
  clusterIP: None # Headless service for the EndpointSlice
  ports:
    - port: 443
      targetPort: 443
      name: https
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: external-service-tlsroute-truenas
  namespace: network
  annotations:
    external-dns.kubernetes.io/target: "internal-tls.materia.wtf"
spec:
  parentRefs:
    - name: envoy-internal-tls
      namespace: network
      sectionName: tls
  hostnames:
    - "nas.materia.wtf"
  rules:
    - backendRefs:
        - name: internal-truenas
          port: 443
