---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: azerothcore
spec:
  chartRef:
    kind: OCIRepository
    name: azerothcore
  # The wow-panel (and manual kubectl) scale these Deployments 0↔1; without
  # the replicas ignore, cluster-wide drift detection reverts every scale
  # within the reconcile interval (precedent: media/arr-apps/bazarr-anime).
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/replicas]
  interval: 1h
  values:
    controllers:
      authserver:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          app:
            nameOverride: authserver
            image: &image
              repository: ghcr.io/materia-ops/azerothcore-wotlk-playerbots
              tag: 1.9.0@sha256:eef5b83830280cb9f4c603245a117f656dd0f4650a2286fcfac12184dc8e990c
            # Image CMD is worldserver; same image runs both servers.
            command: ["authserver"]
            env:
              AC_LOGIN_DATABASE_INFO:
                valueFrom:
                  secretKeyRef:
                    name: azerothcore-secret
                    key: AC_LOGIN_DATABASE_INFO
              # Override-only config model: the image ships authserver.conf
              # as the dist verbatim; the two Materia path deviations ride
              # as AC_* env overrides (see the worldserver env block).
              AC_LOGS_DIR: "/azerothcore/logs"
              AC_SOURCE_DIRECTORY: "/azerothcore/source"
              TZ: Australia/Melbourne
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            probes:
              liveness: &authProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3724
                  periodSeconds: 30
              readiness: *authProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3724
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
      worldserver:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        # RWO client-data PVC: the replacement pod can't mount until the old
        # one is gone.
        strategy: Recreate
        pod:
          # Budget = preStop hook (900s in-game restart countdown when real
          # players are online + 120s hold margin — see
          # scripts/prestop-restart-warning.sh) + SIGTERM save time (~180s:
          # worldserver flushes character/bot state to the DB — generous on
          # purpose, do not shorten). Image runs worldserver as PID 1
          # (exec-form CMD, no shell wrapper). With nobody online the hook
          # returns immediately and only the save time is used.
          terminationGracePeriodSeconds: 1200
        containers:
          app:
            nameOverride: worldserver
            image: *image
            env:
              # Override-only config model: the image ships each .conf.dist as
              # the live conf; deviations are AC_* env vars. Derive names with
              # the vault generator (ac-env-equivalence.sh), never by hand.
              AC_ACCOUNT_ACHIEVEMENTS_ANNOUNCE: "0"
              AC_AI_PLAYERBOT_ADD_CLASS_ACCOUNT_POOL_SIZE: "10"
              AC_AI_PLAYERBOT_AUTO_GEAR_BIS_COMMAND: "1"
              AC_AI_PLAYERBOT_AUTO_GEAR_QUALITY_LIMIT: "4"
              # Dist-less key the pinned playerbot code still READS (boot
              # warns otherwise); ac-image's registry can't pin it (the gate
              # greps the dist). Drop once upstream stops reading it.
              AC_AI_PLAYERBOT_BOT_ONLY_GROUP_FULL_XP: "1"
              AC_AI_PLAYERBOT_COMBAT_STRATEGIES: "+behind,+threat"
              AC_AI_PLAYERBOT_COMMAND_SERVER_PORT: "0"
              AC_AI_PLAYERBOT_ENABLE_PERIODIC_ONLINE_OFFLINE: "1"
              AC_AI_PLAYERBOT_FREE_METHOD_LOOT: "1"
              # Level brackets (ex-#1523): bots follow the real players' level
              # ranges. SyncFactions needs identical faction bracket tables —
              # the dist ships them identical.
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_DYNAMIC_REAL_PLAYER_WEIGHT: "10.0"
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_DYNAMIC_SYNC_FACTIONS: "1"
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_DYNAMIC_USE_DYNAMIC_DISTRIBUTION: "1"
              AC_AI_PLAYERBOT_LEVEL_BRACKETS_ENABLED: "1"
              AC_AI_PLAYERBOT_MAX_RANDOM_BOTS: "300"
              AC_AI_PLAYERBOT_MIN_RANDOM_BOTS: "300"
              AC_AI_PLAYERBOT_PREFERRED_SPEC_WEAPONS: "1"
              AC_AI_PLAYERBOT_PREFER_CLASS_ARMOR_TYPE: "1"
              AC_AI_PLAYERBOT_RANDOM_BOT_AUTO_JOIN_BG: "1"
              AC_AI_PLAYERBOT_RANDOM_BOT_COMBAT_STRATEGIES: "+behind,+threat"
              AC_AI_PLAYERBOT_RANDOM_GEAR_QUALITY_LIMIT: "4"
              AC_AI_PLAYERBOT_TOXIC_LINKS_REPLIES_CHANCE: "0"
              AC_ALE_SCRIPT_PATH: "/azerothcore/lua_scripts"
              AC_ALLOW_TWO_SIDE_INTERACTION_ARENA: "1"
              AC_ALLOW_TWO_SIDE_INTERACTION_CALENDAR: "1"
              AC_ALLOW_TWO_SIDE_INTERACTION_CHANNEL: "1"
              AC_ALLOW_TWO_SIDE_INTERACTION_CHAT: "1"
              AC_ALLOW_TWO_SIDE_INTERACTION_GROUP: "1"
              AC_ALLOW_TWO_SIDE_INTERACTION_GUILD: "1"
              AC_AOELOOT_MESSAGE: "0"
              AC_AOELOOT_RANGE: "30.0"
              # AH-bot identity (WP9): acore_auth account 72 + its character
              # guid 701 — numeric IDs, not secrets. The bot is inert while
              # these override the dist's zeros.
              AC_AUCTION_HOUSE_BOT_ACCOUNT: "72"
              AC_AUCTION_HOUSE_BOT_CONSIDER_ONLY_BOT_AUCTIONS: "1"
              AC_AUCTION_HOUSE_BOT_DIVISIBLE_STACKS: "1"
              AC_AUCTION_HOUSE_BOT_ELAPSING_TIME_CLASS: "0"
              AC_AUCTION_HOUSE_BOT_ENABLE_BUYER: "1"
              AC_AUCTION_HOUSE_BOT_ENABLE_SELLER: "1"
              AC_AUCTION_HOUSE_BOT_GUID: "701"
              AC_AUCTION_HOUSE_BOT_ITEMS_PER_CYCLE: "250"
              AC_AUCTION_HOUSE_BOT_OTHER_ITEMS: "1"
              AC_AUCTION_HOUSE_BOT_OTHER_TRADE_GOODS: "1"
              AC_AUCTION_HOUSE_BOT_PROFESSION_ITEMS: "1"
              AC_AUCTION_HOUSE_BOT_USE_BUY_PRICE_FOR_BUYER: "1"
              AC_AUCTION_HOUSE_BOT_VENDOR_TRADE_GOODS: "1"
              AC_CONSOLE_ENABLE: "0"
              AC_DATA_DIR: "/azerothcore/data"
              AC_LOGS_DIR: "/azerothcore/logs"
              AC_MAP_UPDATE_THREADS: "4"
              AC_MAX_PRIMARY_TRADE_SKILL: "11"
              AC_METRIC_ENABLE: "1"
              AC_METRIC_INFLUX_DB_CONNECTION: "vmsingle-victoria-metrics.o11y.svc.cluster.local;8428;worldserver"
              AC_METRIC_INTERVAL: "10"
              AC_METRIC_OVERALL_STATUS_INTERVAL: "15"
              AC_OLLAMA_CHAT_ENABLE_CHAT_BOT_SNAPSHOT_TEMPLATE: "1"
              AC_OLLAMA_CHAT_ENABLE_GUILD_EVENT_CHATTER: "0"
              AC_OLLAMA_CHAT_ENABLE_RPPERSONALITIES: "1"
              AC_OLLAMA_CHAT_ENABLE_SENTIMENT_TRACKING: "1"
              AC_OLLAMA_CHAT_ENABLE_WHISPER_REPLIES: "1"
              AC_OLLAMA_CHAT_GUILD_RANDOM_CHATTER_CHANCE: "20"
              AC_OLLAMA_CHAT_MAX_CONCURRENT_QUERIES: "2"
              AC_OLLAMA_CHAT_MODEL: "llama3.1:8b-instruct-q4_K_M"
              AC_OLLAMA_CHAT_NUM_PREDICT: "40"
              AC_OLLAMA_CHAT_SYSTEM_PROMPT: "You are a World of Warcraft: Wrath of the Lich King player character. Always stay in character. Reply like a real player typing in game chat: casual, short (under 15 words), era-appropriate slang, no emojis, no markdown, no narration, never mention being an AI."
              AC_OLLAMA_CHAT_URL: "http://kiterium.internal:11434/api/generate"
              AC_SOAP_ENABLED: "1"
              AC_SOAP_IP: "0.0.0.0"
              AC_SOURCE_DIRECTORY: "/azerothcore/source"
              TZ: Australia/Melbourne
            envFrom:
              # The four AC_*_DATABASE_INFO DSNs + SOAP_USERNAME/SOAP_PASSWORD
              # (the preStop hook's SOAP login; non-AC_ names are invisible to
              # AzerothCore's env-override config reader)
              - secretRef:
                  name: azerothcore-secret
            # In-game 15-min restart warning before any orchestrated
            # termination, skipped when no real players are online.
            # Emergency bypass: kubectl delete pod --grace-period=1
            lifecycle:
              preStop:
                exec:
                  command: ["/bin/bash", "/scripts/prestop-restart-warning.sh"]
            securityContext: *securityContext
            probes:
              # Liveness goes through SOAP (`server info` executes on the
              # world update loop) because a hung loop keeps 8085 accepting —
              # TCP alone can't see the realm's most likely failure mode.
              # 5 × 60s + the script's 15s SOAP budget ≈ 5 min unresponsive
              # before a restart; lag spikes (mass bot login) stay safe.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/bash", "/scripts/liveness-soap.sh"]
                  periodSeconds: 60
                  timeoutSeconds: 20
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8085
                  periodSeconds: 30
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8085
                  # 120 × 10 s = 20 min boot budget: first boot applies module
                  # SQL and 300 random bots log in before the world socket
                  # opens; liveness only applies after startup succeeds.
                  failureThreshold: 120
                  periodSeconds: 10
            resources:
              requests:
                cpu: 1
                memory: 5Gi
              limits:
                memory: 8Gi
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Defined in azerothcore-db (which this app dependsOn): under node
      # pressure the realm pods are evicted after ordinary workloads.
      priorityClassName: azerothcore-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      auth:
        controller: authserver
        type: LoadBalancer
        annotations:
          # gatus-sidecar (service kind is opt-in, no auto): probe the VIP —
          # the same path a player's client takes. Group `games` is
          # deliberately outside the GatusEndpointDown rule's external|services
          # match: deliberate scale-to-0 via the panel must not page; the
          # replica-guarded alert lives in prometheusrule.yaml.
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            name: wow-auth
            group: games
            url: tcp://192.168.10.120:3724
            interval: 1m
            conditions: ["[CONNECTED] == true"]
          # Players' realmlist.wtf uses the name `wow.internal` → this VIP.
          # That record is MANUAL on the Pi-holes (owner-created/preferred) —
          # an external-dns hostname annotation can't manage it: every LAN
          # instance filters to materia.wtf (domainFilters), so an .internal
          # annotation is silently dropped.
          # Both game Services share the realm VIP (WP8 validated live);
          # the VIP is permanent — it's baked into the DB realmlist row.
          lbipam.cilium.io/ips: 192.168.10.120
          lbipam.cilium.io/sharing-key: azerothcore
        ports:
          auth:
            port: 3724
      soap:
        # ClusterIP ONLY — SOAP is the admin path (account creation, GM
        # commands, player counts) and must never be exposed via
        # LoadBalancer or HTTPRoute.
        controller: worldserver
        ports:
          soap:
            port: 7878
      world:
        controller: worldserver
        type: LoadBalancer
        annotations:
          # See the auth service's gatus comment.
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            name: wow-world
            group: games
            url: tcp://192.168.10.120:8085
            interval: 1m
            conditions: ["[CONNECTED] == true"]
          lbipam.cilium.io/ips: 192.168.10.120
          lbipam.cilium.io/sharing-key: azerothcore
        ports:
          world:
            port: 8085
    persistence:
      client-data:
        # Populated once by the WP2 extraction (maps/vmaps/mmaps/dbc/cameras
        # + VERSION marker); worldserver only ever reads it.
        existingClaim: azerothcore-client-data
        advancedMounts:
          worldserver:
            app:
              - path: /azerothcore/data
                readOnly: true
      logs:
        type: emptyDir
        globalMounts:
          - path: /azerothcore/logs
      lua-scripts:
        # ALE.ScriptPath — empty today; future Lua lands via git in
        # app/lua_scripts/, no image rebuild.
        type: configMap
        name: azerothcore-lua-scripts
        advancedMounts:
          worldserver:
            app:
              - path: /azerothcore/lua_scripts
                readOnly: true
      scripts:
        type: configMap
        name: azerothcore-scripts
        advancedMounts:
          worldserver:
            app:
              - path: /scripts
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
