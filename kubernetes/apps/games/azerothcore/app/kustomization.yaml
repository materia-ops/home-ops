---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  # Mounted at ALE.ScriptPath; add future .lua files here.
  - name: azerothcore-lua-scripts
    files:
      - ./lua_scripts/README.md
      - ./lua_scripts/wwi-tyraels-hilt.lua
  - name: azerothcore-scripts
    files:
      - ./scripts/liveness-soap.sh
      - ./scripts/prestop-restart-warning.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Load-bearing: strict envsubst would mangle the scripts' bash ${...}.
    kustomize.toolkit.fluxcd.io/substitute: disabled
