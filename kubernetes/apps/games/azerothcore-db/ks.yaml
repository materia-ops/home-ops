---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app azerothcore-db
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/games/azerothcore-db/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  wait: false
---
# yaml-language-server: $schema=https://schemas.materia.wtf/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app azerothcore-db-backups
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    # dump CronJobs read the DB credentials secret created by azerothcore-db
    - name: azerothcore-db
      namespace: games
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/games/azerothcore-db/backups
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 20Gi
      # Daily, not the kopiur default (H * * * *): the dumps must land first.
      # Fires 04:30-04:40 Australia/Melbourne (repository jitter) — 90min after
      # the nightly dump but only ~30min after the Sunday world one, which it can
      # catch mid-write; backup-world.sh retains the previous complete dump.
      KOPIUR_SCHEDULE: "30 4 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  wait: false
