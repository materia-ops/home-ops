---
# yaml-language-server: $schema=https://schemas.materia.wtf/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wow-panel
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/controller: wow-panel
      app.kubernetes.io/name: wow-panel
  # The panel trusts the x-authentik-* headers the gateway injects, so only the
  # gateway may reach it: any other pod could forge them. Ingress only; egress
  # stays open.
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts: &http
        - ports:
            - port: "3000"
              protocol: TCP
    # gatus builds checks from any Service/HTTPRoute annotation, so it gets
    # only the health endpoint (helmrelease.yaml). Own entry: the http rule
    # proxies this peer alone; the gateway and kubelet entries stay L3/L4.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: o11y
            app.kubernetes.io/name: gatus-sidecar
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: ^/api/healthz$
    # kubelet probes
    - fromEntities:
        - host
      toPorts: *http
