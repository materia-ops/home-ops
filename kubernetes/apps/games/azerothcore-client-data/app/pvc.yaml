---
# Game client data from the manual extract Job (materia-vault
# projects/wow-server/manifests/client-data-extract-job.yaml). Its own app so it
# survives any game-app lifecycle; no kopiur backup: re-extraction reproduces it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azerothcore-client-data
spec:
  # RWO: the extract Job must be gone before worldserver (read-only) starts.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-block
