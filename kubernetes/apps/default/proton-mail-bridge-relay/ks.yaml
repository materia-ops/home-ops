---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proton-mail-bridge-relay
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/proton-mail-bridge-relay/app
  postBuild:
    substitute:
      APP: proton-mail-bridge-relay
      # Root mover: the Bridge image hardcodes /root, so its data is root-owned
      # and the default uid 1000 cannot read it. Permitted by the
      # privileged-movers annotation on the default namespace.
      KOPIUR_PGID: "0"
      KOPIUR_PUID: "0"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
