---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

components:
  - ../../components/alerts
  - ../../components/kopiur/secret
  - ../../components/namespace

patches:
  - target:
      kind: Namespace
    patch: |
      # for proton-mail-bridge-relay's root mover
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"

resources:
  - ./proton-mail-bridge-relay/ks.yaml
  - ./raidscope/ks.yaml
  - ./thelounge/ks.yaml
  - ./theme-park/ks.yaml
