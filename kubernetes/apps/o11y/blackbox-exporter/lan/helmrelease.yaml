---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-lan
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-lan
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-lan
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: { add: ["NET_RAW"] }
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
        tls_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
            tls: true
            tls_config:
              # An expired cert must still complete the handshake, so the
              # expiry series keeps reporting it instead of going absent.
              insecure_skip_verify: true
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        # 7d sits under TrueNAS's 10-day ACME renewal window, so a healthy
        # renewal never fires it; negative values (already expired) keep it firing.
        - alert: LanCertExpiringSoon
          expr: |-
            probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"} - time() < 7 * 86400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: |-
              The TLS cert served by {{ $labels.instance }} expires in {{ $value | humanizeDuration }} (negative: already expired); the device has not renewed it, or has not reloaded the renewed cert
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-lan"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
