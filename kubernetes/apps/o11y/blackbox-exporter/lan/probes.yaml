---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
spec:
  module: icmp
  prober:
    url: blackbox-exporter-lan.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - nas.internal
        - pikvm.internal
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tcp
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - nas.internal:2049
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-lan
      action: replace
    # job must be nfs_probe, the name the zeroscaler HPA component reads through
    # prometheus-adapter. As "probe/o11y/lan-tcp" every torrents HPA sticks at
    # ScalingActive=False and scale-to-zero on NFS failure never fires.
    - targetLabel: job
      replacement: nfs_probe
      action: replace
