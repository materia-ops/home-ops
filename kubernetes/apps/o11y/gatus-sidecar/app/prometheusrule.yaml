---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-sidecar-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |
            gatus_results_endpoint_success{group=~"external|services"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical

        - alert: GatusEndpointExposed
          expr: |
            gatus_results_endpoint_success{group="internal"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint has a public DNS record and is exposed
          labels:
            severity: critical

        - alert: GatusCiPipelineBroken
          expr: |
            gatus_results_endpoint_success{group="ci"} == 0
          # 2h: two consecutive bad hourly Renovate runs, never one transient.
          for: 2h
          annotations:
            summary: >-
              CI dead-man check {{ $labels.name }} is failing (cron disabled, latest run failed, or the monitoring PAT died)
          labels:
            depends_on: internet
            severity: critical

        - alert: GatusUpstreamDown
          expr: |
            gatus_results_endpoint_success{group="upstreams"} == 0
          for: 30m
          annotations:
            summary: >-
              The {{ $labels.name }} third-party upstream is unreachable
          labels:
            depends_on: internet
            # Third-party outages aren't actionable at 3am — warn, don't page.
            severity: warning

        # The WAN, not the cluster: all three icmp checks down, or the UDM's own WAN
        # health check (unpoller, polled over the LAN). Alertmanager inhibits the
        # internet-dependent alerts; held 20m so the 15m-window send-failure alerts drain.
        - alert: InternetDown
          expr: |
            max(gatus_results_endpoint_success{group="connectivity"}) == 0
            or on()
            max(unpoller_site_uptime_seconds{subsystem="www"}) == 0
          for: 3m
          keep_firing_for: 20m
          annotations:
            summary: >-
              Internet connectivity is down (gatus icmp to Cloudflare, Google and Quad9, or the UDM WAN health check); internet-dependent alerts are inhibited. If the UDM shows WAN traffic, suspect cluster egress instead
          labels:
            severity: critical

        # Pushover is internet-hosted: if this arrives the internet works, so the
        # InternetDown sensor is broken and internet-dependent alerts are muted.
        - alert: InternetDownProlonged
          expr: |
            max(gatus_results_endpoint_success{group="connectivity"}) == 0
            or on()
            max(unpoller_site_uptime_seconds{subsystem="www"}) == 0
          for: 2h
          annotations:
            summary: >-
              InternetDown has fired for 2h while this notification got through; check the gatus icmp checks and the unpoller WAN health series
          labels:
            severity: warning
