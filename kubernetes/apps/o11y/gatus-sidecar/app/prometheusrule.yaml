---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-sidecar-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |
            gatus_results_endpoint_success{group=~"external|services"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical

        - alert: GatusEndpointExposed
          expr: |
            gatus_results_endpoint_success{group="internal"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint has a public DNS record and is exposed
          labels:
            severity: critical

        - alert: GatusReleasePipelineBroken
          expr: |
            gatus_results_endpoint_success{group="ci"} == 0
          for: 1h
          annotations:
            summary: >-
              CI dead-man check {{ $labels.name }} is failing (cron disabled, last scheduled run failed, or the monitoring PAT expired)
          labels:
            severity: critical

        - alert: GatusUpstreamDown
          expr: |
            gatus_results_endpoint_success{group="upstreams"} == 0
          for: 30m
          annotations:
            summary: >-
              The {{ $labels.name }} third-party upstream is unreachable
          labels:
            # Third-party outages aren't actionable at 3am — warn, don't page.
            severity: warning
