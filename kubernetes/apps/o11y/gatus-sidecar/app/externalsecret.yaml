---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-sidecar
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-sidecar-secret
    template:
      # A key missing from the 1P "gatus" item fails the whole secret template.
      data:
        # read-only Authentik API token (21-monitoring.yaml) for authentik-blueprints
        AUTHENTIK_TOKEN: "{{ .AUTHENTIK_TOKEN }}"
        # ONE fine-grained PAT (resource owner materia-ops, so it survives repo
        # transfers; Actions: Read-only) for every ci-group check in config.yaml.
        # Watching a new repo = add it to its repository scope. A dead token alerts.
        GATUS_STATUS_TOKEN: "{{ .GATUS_STATUS_TOKEN }}"
  dataFrom:
    - extract:
        key: gatus
