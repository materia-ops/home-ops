---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: node-exporter
  interval: 1h
  values:
    # igc pause-frame/queue counters for the c2/c3 rx FIFO drops; scoped to keep cardinality small.
    extraArgs:
      - --collector.ethtool
      - --collector.ethtool.device-include=^enp[34]s0$
      - --collector.ethtool.metrics-include=^(rx_flow_control_xo(n|ff)|tx_flow_control_xo(n|ff)|rx_missed_errors|rx_no_buffer_count|rx_queue_[0-9]+_(packets|drops)|rx_lpi_counter|tx_lpi_counter)$
    fullnameOverride: node-exporter
    prometheus:
      monitor:
        enabled: true
        jobLabel: app.kubernetes.io/instance
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: kubernetes_node
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: nodename
    resources:
      requests:
        cpu: 10m
        memory: 64M
      limits:
        memory: 64M
    hostNetwork: true
