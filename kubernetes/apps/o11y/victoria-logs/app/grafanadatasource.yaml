---
# yaml-language-server: $schema=https://schemas.materia.wtf/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # The operator installs the plugin into Grafana's PVC-backed plugins dir, so
  # the read-only rootfs is unaffected.
  plugins:
    - name: victoriametrics-logs-datasource
      version: 0.29.0
  datasource:
    name: VictoriaLogs
    # Pinned: dashboards reference it (e.g. wow-panel-audit).
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs.o11y.svc.cluster.local:9428
    isDefault: false
