---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator-crds
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-operator-crds
  interval: 1h
  # Suspended so the follow-up removal orphans the Helm release (an uninstall
  # would delete the CRDs and cascade every VM custom resource). Never resume:
  # drift correction would re-apply this chart's stale CRD set over the stack's.
  suspend: true
