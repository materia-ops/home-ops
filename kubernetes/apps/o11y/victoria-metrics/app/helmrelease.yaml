---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  interval: 1h
  values:
    fullnameOverride: victoria-metrics
    global:
      image:
        registry: quay.io
    alertmanager:
      config:
        route:
          receiver: pushover
          repeat_interval: 12h
          routes:
            - receiver: blackhole
              matchers:
                - alertname = InfoInhibitor
          group_by:
            - alertname
            - cluster
            - job
          group_interval: 5m
          group_wait: 1m
        inhibit_rules:
          - equal:
              - alertname
              - namespace
            source_matchers:
              - severity = "critical"
            target_matchers:
              - severity = "warning"
        receivers:
          - name: blackhole
          - name: pushover
            pushover_configs:
              - html: true
                message: |-
                  {{- range .Alerts }}
                    {{- if ne .Annotations.description "" }}
                      {{ .Annotations.description }}
                    {{- else if ne .Annotations.summary "" }}
                      {{ .Annotations.summary }}
                    {{- else if ne .Annotations.message "" }}
                      {{ .Annotations.message }}
                    {{- else }}
                      Alert description not available
                    {{- end }}
                    {{- if gt (len .Labels.SortedPairs) 0 }}
                      <small>
                        {{- range .Labels.SortedPairs }}
                          <b>{{ .Name }}:</b> {{ .Value }}
                        {{- end }}
                      </small>
                    {{- end }}
                  {{- end }}
                priority: |-
                  {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
                send_resolved: true
                sound: gamelan
                title: >-
                  [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                token:
                  name: vmalertmanager-secret
                  key: ALERTMANAGER_PUSHOVER_TOKEN
                url_title: View in Alertmanager
                user_key:
                  name: vmalertmanager-secret
                  key: PUSHOVER_USER_KEY
      route:
        enabled: true
        hostnames:
          - vmalertmanager.materia.wtf
        parentRefs:
          - name: envoy-internal
            namespace: network
      spec:
        externalURL: https://vmalertmanager.materia.wtf
        image:
          repository: quay.io/prometheus/alertmanager
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
      useManagedConfig: true
    defaultDashboards:
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
    defaultRules:
      rules:
        # Upstream only excludes fixed-size HPAs (max == min). The zeroscaler
        # tier is min 0 / max 1, so every awake app read as "maxed out" —
        # 19 permanently-firing alerts smothered by a blanket silence that
        # also swallowed genuine maxed-out HPAs. Third guard (max > 1) makes
        # the alert meaningful again; the silence is retired with it.
        KubeHpaMaxedOut:
          spec:
            expr: |-
              (kube_horizontalpodautoscaler_status_current_replicas{job="kube-state-metrics",namespace=~".*"} == kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",namespace=~".*"})
              and on(namespace,horizontalpodautoscaler,cluster) (kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",namespace=~".*"} != kube_horizontalpodautoscaler_spec_min_replicas{job="kube-state-metrics",namespace=~".*"})
              and on(namespace,horizontalpodautoscaler,cluster) (kube_horizontalpodautoscaler_spec_max_replicas{job="kube-state-metrics",namespace=~".*"} > 1)
    defaultDatasources:
      grafanaOperator:
        enabled: true
        spec:
          allowCrossNamespaceImport: true
    grafana:
      enabled: false
      forceDeployDatasource: true
    kube-state-metrics:
      enabled: false
    kubelet:
      vmScrape:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: "feature_node_kubernetes_io_.+"
            - action: labeldrop
              regex: "extensions_talos_dev_.+"
            - action: labeldrop
              regex: "node_kubernetes_io_.+"
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          endpoints:
            - scheme: http
    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    prometheus-node-exporter:
      enabled: false
    victoria-metrics-operator:
      crds:
        enabled: false
        plain: false
        cleanup:
          enabled: false
      operator:
        enable_converter_ownership: true
    vmagent:
      spec:
        additionalScrapeConfigs:
          name: victoriametrics-notifiarr-scrape-secret
          key: notifiarr.yaml
        extraArgs:
          promscrape.dropOriginalLabels: "true"
          promscrape.maxScrapeSize: 50MiB
          promscrape.streamParse: "true"
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
    vmalert:
      spec:
        extraArgs:
          external.url: https://vmalert.materia.wtf
        datasource:
          url: http://vmauth-victoria-metrics.o11y.svc.cluster.local:8427
      route:
        enabled: true
        hostnames:
          - vmalert.materia.wtf
        parentRefs:
          - name: envoy-internal
            namespace: network
    vmauth:
      enabled: true
      spec:
        extraArgs:
          requestBufferSize: "65536"
        unauthorizedUserAccessSpec:
          url_map:
            - src_paths:
                - /api/v1/query.*
                - /api/v1/label/.*
              url_prefix: http://vmsingle-victoria-metrics.o11y.svc.cluster.local:8428
            - src_paths:
                - /select/logsql/.*
              url_prefix: http://victoria-logs.o11y.svc.cluster.local:9428
    vmsingle:
      route:
        enabled: true
        hostnames:
          - vmsingle.materia.wtf
        parentRefs:
          - name: envoy-internal
            namespace: network
      spec:
        extraArgs:
          maxLabelsPerTimeseries: "100"
          search.maxConcurrentRequests: "8"
          search.maxQueueDuration: "30s"
          search.maxMemoryPerQuery: "300MB"
        resources:
          requests:
            cpu: 150m
            memory: 1Gi
          limits:
            memory: 3Gi
        retentionPeriod: 90d
        # 90d retention holds 4 monthly partitions at peak (~39G) + ~10G indexdb;
        # 50Gi breached the 20%-free merge headroom VM needs (DiskRunsOutOfSpace 2026-08).
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 75Gi
          storageClassName: ceph-block
    additionalVictoriaMetricsMap:
      dockerhub-rules:
        create: true
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        create: true
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      prowlarr-rules:
        create: true
        groups:
          - name: prowlarr
            type: vlogs
            interval: 30m
            rules:
              # MAM locks each session cookie to an IP (or ASN); when the
              # cookie dies every MAM query 403s until a human mints a new
              # one, so the alert carries the fix. Matching the bare cookie
              # name catches all MAM error variants ("mam_id expired or
              # invalid" etc.) — at info level it never appears otherwise.
              - alert: ProwlarrMamSessionExpired
                annotations:
                  summary: >-
                    Prowlarr's MyAnonamouse session cookie is dead — {{ $value }} mam_id auth failure(s) in the last 30m.
                  description: >-
                    Prowlarr's MyAnonamouse mam_id cookie expired or got IP-invalidated — all MAM searches/RSS are 403ing.
                    Fix: from the home network (Prowlarr egresses via the house WAN IP, not the VPN), log in to MyAnonamouse
                    → Preferences → Security, create a new session locked to the current IP (ASN-locked if the IP may change),
                    copy the mam_id value, then Prowlarr → Indexers → MyAnonamouse → paste into MAM ID → Test → Save.
                expr: |-
                  kubernetes.pod_namespace:=media kubernetes.container_name:=prowlarr "mam_id" | stats count() as failures | filter failures:>0
                labels:
                  severity: warning
      recyclarr-rules:
        create: true
        groups:
          - name: recyclarr
            type: vlogs
            interval: 30m
            rules:
              - alert: RecyclarrLogErrors
                annotations:
                  summary: Recyclarr logged {{ $value }} error/warning line(s) in the last 30m. Check the recyclarr logs in VictoriaLogs.
                expr: |-
                  kubernetes.pod_namespace:=media kubernetes.container_name:=recyclarr ("[ERR]" OR "[WRN]" OR "[FTL]" OR "level=error") | stats count() as errors | filter errors:>0
                labels:
                  severity: warning
      sqlite-rules:
        create: true
        groups:
          # Migrated from the retired per-app lokirule.yaml files; one
          # namespace-wide group now also covers bazarr/lidarr, which the
          # old copies never did. stats by app -> one alert per container.
          - name: sqlite
            type: vlogs
            interval: 5m
            rules:
              - alert: MediaDatabaseLocked
                annotations:
                  summary: >-
                    {{ $labels.app }} is logging SQLite "database is locked" errors — its DB is under contention or the config volume is unhealthy.
                expr: |-
                  kubernetes.pod_namespace:=media i("database is locked") | rename kubernetes.container_name as app | stats by (app) count() as hits | filter hits:>0
                for: 5m
                labels:
                  severity: critical
              # Corruption is never transient — no `for`, page on first sight.
              - alert: MediaDatabaseMalformed
                annotations:
                  summary: >-
                    {{ $labels.app }} SQLite database is malformed — likely corruption; restore the config PVC from the latest volsync snapshot.
                expr: |-
                  kubernetes.pod_namespace:=media i("database disk image is malformed") | rename kubernetes.container_name as app | stats by (app) count() as hits | filter hits:>0
                labels:
                  severity: critical
              - alert: PlexDatabaseBusy
                annotations:
                  summary: >-
                    Plex is logging "retry busy DB" — its database is under sustained contention.
                expr: |-
                  kubernetes.pod_namespace:=media kubernetes.container_name:=plex i("retry busy DB") | stats count() as hits | filter hits:>0
                for: 5m
                labels:
                  severity: critical
      wow-panel-rules:
        create: true
        groups:
          - name: wow-panel
            type: vlogs
            # Evaluate every 10m over an explicit 30m window (the _time filter
            # in the expr overrides vmalert's default interval-sized window),
            # with for: 30m — paging needs ~4 consecutive empty windows, so a
            # one-off ingestion hiccup or pod roll at an evaluation boundary
            # can't false-page (it did exactly that on first deploy).
            interval: 10m
            rules:
              # The panel logs `[idle-scaledown] check: ...` every tick
              # (5 min) while IDLE_SCALEDOWN_ENABLED=true — a documented
              # liveness contract (wow-panel README). Silence over a full 30m
              # window means the loop is wedged, the pod is crash-looping, or
              # log collection broke. Also fires if the kill switch is turned
              # off — a deliberate reminder that auto-park is disabled.
              - alert: WowPanelIdleLoopSilent
                annotations:
                  summary: wow-panel logged no idle-scaledown check line in 30m — the auto-park loop is wedged or disabled. Check the wow-panel pod logs.
                expr: |-
                  kubernetes.pod_namespace:=games kubernetes.container_name:=wow-panel "[idle-scaledown]" _time:30m | stats count() as checks | filter checks:<1
                for: 30m
                labels:
                  severity: warning
      zfs-rules:
        create: true
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
