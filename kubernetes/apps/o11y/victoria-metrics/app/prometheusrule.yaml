---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ext4-rules
spec:
  groups:
    - name: ext4.rules
      rules:
        # From the Ansible ext4_metrics timer. The counter persists until e2fsck clears it.
        - alert: Ext4FilesystemErrors
          expr: |-
            ext4_errors_total > 0
          for: 5m
          annotations:
            summary: >-
              ext4 on {{ $labels.device }} ({{ $labels.instance }}) has recorded {{ $value }}
              errors; the SD card or disk is likely failing
          labels:
            severity: critical

        # Only the static *.internal:9100 targets run the timer (in-cluster nodes are
        # bare names); nas runs TrueNAS's own node_exporter.
        - alert: Ext4MetricsStale
          expr: |-
            up{job="node-exporter", instance=~".+\\.internal:9100", instance!~"nas\\..*"} == 1
            unless on(instance)
            (time() - node_textfile_mtime_seconds{file=~".*ext4\\.prom"} < 3600)
          for: 30m
          annotations:
            summary: >-
              {{ $labels.instance }} has no fresh ext4 metrics; check ext4-metrics.timer
          labels:
            severity: warning
---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: systemd-rules
spec:
  groups:
    - name: systemd.rules
      rules:
        # Duplicates node-mixin's rule if the chart's own node-exporter is ever enabled.
        # keep_firing_for spans a retry's activating window (certbot sleeps up to 8m first).
        - alert: NodeSystemdServiceFailed
          expr: |-
            node_systemd_unit_state{job="node-exporter", instance=~".+\\.internal:9100", instance!~"nas\\..*", state="failed"} == 1
          for: 5m
          keep_firing_for: 15m
          annotations:
            summary: >-
              {{ $labels.name }} failed on {{ $labels.instance }}; journalctl -u {{ $labels.name }}
              there shows why
          labels:
            severity: warning
