---
# yaml-language-server: $schema=https://schemas.materia.wtf/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
spec:
  chartRef:
    kind: OCIRepository
    name: kromgo
  interval: 1h
  values:
    config:
      prometheus: http://vmsingle-victoria-metrics.{{ .Release.Namespace }}.svc.cluster.local:8428
      badges:
        - title: Talos
          id: talos_version
          query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
          valueExpr: labels["version_id"]
          icon: si:talos

        - title: Kubernetes
          id: kubernetes_version
          query: label_replace(kubernetes_build_info{job="apiserver"}, "git_version", "$1", "git_version", "v(.+)")
          valueExpr: labels["git_version"]
          icon: si:kubernetes

        - title: Flux
          id: flux_version
          query: label_replace(flux_instance_info, "revision", "$1", "revision", "v(.+)@sha256:.+")
          valueExpr: labels["revision"]
          icon: si:flux

        - title: Nodes
          id: cluster_node_count
          query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
          colorExpr: '"green"'

        - title: Pods
          id: cluster_pod_count
          query: sum(kube_pod_status_phase{phase="Running"})
          valueExpr: humanizeCommas(result)
          colorExpr: '"green"'

        - title: CPU
          id: cluster_cpu_usage
          query: round((1 - avg(rate(node_cpu_seconds_total{mode="idle",pod!=""}[5m]))) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Memory
          id: cluster_memory_usage
          query: round(sum(node_memory_MemTotal_bytes{pod!=""} - node_memory_MemAvailable_bytes{pod!=""}) / sum(node_memory_MemTotal_bytes{pod!=""}) * 100, 0.1)
          valueExpr: string(result) + "%"
          colorExpr: 'colorScale(result, [35.0, 75.0], ["green", "orange", "red"])'

        - title: Ceph
          id: ceph_health
          query: ceph_health_status
          valueExpr: 'result == 0.0 ? "healthy" : (result == 1.0 ? "warning" : "error")'
          colorExpr: 'result == 0.0 ? "green" : (result == 1.0 ? "orange" : "red")'
          icon: si:ceph

        - title: Age
          id: cluster_birth_age
          query: round(time() - min(kube_node_created))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Uptime
          id: cluster_uptime_age
          query: round(avg(node_time_seconds{pod!=""} - node_boot_time_seconds{pod!=""}))
          valueExpr: humanizeDurationDays(result)
          colorExpr: 'colorScale(result, [15552000.0, 31104000.0], ["green", "orange", "red"])'

        - title: Alerts
          id: cluster_alert_count
          query: count(ALERTS{alertstate="firing",severity=~"warning|critical"}) or vector(0)
          colorExpr: 'colorScale(result, [1.0], ["green", "red"])'

        - title: Internet
          id: home_internet
          query: gatus_results_endpoint_success{key="connectivity_cloudflare"}
          valueExpr: 'result == 1.0 ? "up" : "down"'
          colorExpr: 'result == 1.0 ? "brightgreen" : "red"'
          icon: si:ubiquiti
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /healthz
      hostnames:
        - "{{ .Release.Name }}.materia.wtf"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
