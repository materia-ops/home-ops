---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-storage-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-storage-exporter-secret
  # Named fields, not dataFrom.extract: the unifi-ro Login item carries
  # unlabelled form fields from a browser save, which extract rejects.
  data:
    - secretKey: UNIFI_PASSWORD
      remoteRef:
        key: unifi-ro
        property: password
    - secretKey: UNIFI_USERNAME
      remoteRef:
        key: unifi-ro
        property: username
