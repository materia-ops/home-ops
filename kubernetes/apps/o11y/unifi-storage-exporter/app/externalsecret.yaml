---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-storage-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unifi-storage-exporter-secret
    template:
      data:
        # local View Only console account; /api/system refuses API keys
        UNIFI_PASSWORD: "{{ .password }}"
        UNIFI_USERNAME: "{{ .username }}"
  dataFrom:
    - extract:
        key: unifi-ro
