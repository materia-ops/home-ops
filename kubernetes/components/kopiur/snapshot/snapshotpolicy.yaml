---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  # Pinned: an unset copyMethod can be re-defaulted under SSA.
  copyMethod: Snapshot
  mover:
    # Sized apart from the PVC so a 50Gi app does not get a 50Gi cache.
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      mode: Ephemeral
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=openebs-hostpath}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: materia
  retention:
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  verification:
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
