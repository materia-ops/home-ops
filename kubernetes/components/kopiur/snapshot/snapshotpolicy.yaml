---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd-fastest
  # Pinned so an upstream default change cannot flip it under us.
  copyMethod: Snapshot
  mover:
    # Sized apart from the PVC so a 50Gi app does not get a 50Gi cache;
    # kopia's own cache budgets are capped below the volume so it cannot ENOSPC.
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      contentCacheSizeMb: 2048
      metadataCacheSizeMb: 1024
      mode: Ephemeral
      storageClassName: openebs-hostpath
    # Mirrors the repository moverDefaults; exists only for the per-app override.
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: materia
  retention:
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  upload:
    maxParallelFileReads: 2
  verification:
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: csi-ceph-blockpool
