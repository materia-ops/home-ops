---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd-fastest
  # pinned against an upstream default change
  copyMethod: Snapshot
  mover:
    # sized apart from the PVC
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      contentCacheSizeMb: 2048
      metadataCacheSizeMb: 1024
      mode: Ephemeral
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: materia
  retention:
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  upload:
    maxParallelFileReads: 2
  verification:
    deep:
      schedule:
        cron: H 5 1 * *
    quick:
      schedule:
        cron: H 3 * * *
  volumeSnapshotClassName: csi-ceph-blockpool
