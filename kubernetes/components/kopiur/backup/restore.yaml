---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  # Restore movers inherit nothing from the policy: cache, uid and fsGroup
  # (the restored ceph-block volume is group-owned by fsGroup) are set here.
  mover:
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      contentCacheSizeMb: 2048
      metadataCacheSizeMb: 1024
      mode: Ephemeral
      storageClassName: openebs-hostpath
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: ${APP}
  target:
    populator: {}
