---
# yaml-language-server: $schema=https://schemas.materia.wtf/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-${APP}
spec:
  # CNPG's standard image plus TimescaleDB (TSL build), toolkit and PostGIS
  imageName: ghcr.io/imusmanmalik/timescaledb-postgis:18.6-3.6.4-202610261019-standard-bookworm@sha256:a84d6e4cb3b7c9e66251bd87bf47d3ea391b19a7f0e27e34fc83e3ad12d00fc9
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb
        - CREATE EXTENSION IF NOT EXISTS timescaledb_toolkit
  postgresql:
    parameters:
      # drop_chunks/retention locks every chunk, compressed chunk and index in
      # one transaction; the default 64 starves the lock table
      max_locks_per_transaction: "256"
      timescaledb.license: timescale
      timescaledb.telemetry_level: "off"
    shared_preload_libraries:
      - timescaledb
