---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Layer after cnpg/app for apps that need TimescaleDB's community edition
# (compression, continuous aggregates, retention policies).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: ./cluster-timescaledb-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
