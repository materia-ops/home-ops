---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Layer after cnpg/app for apps whose database doesn't warrant HA: one
# instance, no synchronous replication, and no PDB (it would block drains).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - path: ./cluster-single-instance-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
