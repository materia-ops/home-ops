---
# yaml-language-server: $schema=https://schemas.materia.wtf/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-${APP}
spec:
  instances: ${DB_INSTANCES:-2}
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm
  enableSuperuserAccess: false
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised

  affinity:
    podAntiAffinityType: required

  storage:
    size: ${DB_SIZE:-10Gi}
    storageClass: ${DB_STORAGE_CLASS:-openebs-hostpath}

  postgresql:
    # dataDurability=preferred (default): with the standby away, writes commit locally
    # instead of blocking, the right call at 2 instances. At 3+ set DB_DURABILITY=required:
    # one node lost still leaves a sync standby to ack, so no data loss and no write stall.
    synchronous:
      method: any
      number: 1
      dataDurability: ${DB_DURABILITY:-preferred}
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      max_wal_size: 4GB
      checkpoint_timeout: 10min
      wal_compression: lz4
      autovacuum_max_workers: "3"
      autovacuum_vacuum_cost_limit: "2000"
      log_min_duration_statement: "500"
      log_checkpoints: "on"
      log_lock_waits: "on"
      log_timezone: Australia/Melbourne
      timezone: Australia/Melbourne
    pg_hba:
      - hostssl all all all scram-sha-256

  bootstrap:
    # Normal path: fresh cluster. For disaster recovery from a barman-cloud
    # backup, use the components/cnpg/restore component overlay instead —
    # see that component's kustomization.yaml for the full restore procedure.
    initdb:
      database: ${APP}
      owner: ${APP}

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      # serverName defaults to the cluster name and is also the sync prefix in
      # components/cnpg/b2-sync/helmrelease.yaml: change both together
      parameters:
        barmanObjectName: postgres-${APP}-backup

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: ${DB_MEMORY_LIMIT:-2Gi}
