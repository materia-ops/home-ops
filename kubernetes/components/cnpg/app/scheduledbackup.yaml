---
# yaml-language-server: $schema=https://schemas.materia.wtf/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-${APP}-backup
spec:
  schedule: "0 30 2 * * *"   # daily 02:30 Melbourne
  backupOwnerReference: self
  cluster:
    name: postgres-${APP}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
