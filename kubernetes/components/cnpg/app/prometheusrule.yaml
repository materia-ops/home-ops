---
# yaml-language-server: $schema=https://schemas.materia.wtf/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-${APP}-backup
spec:
  groups:
    - name: postgres-${APP}-backup.rules
      rules:
        - alert: CNPGBackupStale
          expr: |-
            time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{pod=~"postgres-${APP}-[0-9]+"}) > 172800
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{pod=~"postgres-${APP}-[0-9]+"})
          annotations:
            summary: >-
              No completed barman-cloud backup for postgres-${APP} in 48h
          for: 1h
          labels:
            severity: critical
        # KubeJobFailed covers failed runs; this covers no success at all.
        # A new CronJob gets 6h for its first seed before alerting.
        - alert: CNPGOffsiteSyncStale
          expr: |-
            time() - kube_cronjob_status_last_successful_time{cronjob="postgres-${APP}-offsite"} > 21600
              or (time() - kube_cronjob_created{cronjob="postgres-${APP}-offsite"} > 21600
                unless on(namespace, cronjob) kube_cronjob_status_last_successful_time{cronjob="postgres-${APP}-offsite"})
              or absent(kube_cronjob_created{cronjob="postgres-${APP}-offsite"})
              or kube_cronjob_spec_suspend{cronjob="postgres-${APP}-offsite"} == 1
          annotations:
            summary: >-
              No successful Garage → B2 offsite sync for postgres-${APP} in 6h
          for: 1h
          labels:
            depends_on: internet
            severity: warning
