---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/pushsecret_v1alpha1.json
# Pushes the app user's password from the CNPG-generated 'postgres-${APP}-app'
# Secret to the 1Password item of the same name, which the ExternalSecret reads
# back. On first deploy or after a restore that read errors until this push lands (~5m).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: postgres-${APP}-app
spec:
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: postgres-${APP}-app
  data:
    # ONE entry only: every sync calls UpdateItem per entry, and Connect's per-item
    # optimistic locking intermittently 400s the second of two back-to-back.
    - match:
        # Per-property (secretKey + property) is REQUIRED: ESO's 1Password provider has
        # no whole-secret push, and an empty secretKey fails with the MISLEADING "key
        # not found in 1Password Vaults" (it missed the source Secret's data; #1127).
        secretKey: password
        remoteRef:
          remoteKey: postgres-${APP}-app
          # No username entry: it is static (the initdb owner ${APP}, cluster.yaml) and
          # templated on read-back, so a fresh vault item needs only this field.
          property: password
