---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
# Keys for the Garage → B2 offsite sync (from the 'cnpg' 1Password item), named
# as rclone config env vars so the CronJob loads them with envFrom.
# Garage: read-only key, never barman's owner key. B2: no deleteFiles, so a
# sync delete can only hide a file (purged 30d later by the bucket lifecycle).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-${APP}-offsite
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgres-${APP}-offsite-secret
  data:
    - secretKey: RCLONE_CONFIG_B2_ACCESS_KEY_ID
      remoteRef:
        key: cnpg
        property: b2-key-id
    - secretKey: RCLONE_CONFIG_B2_SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg
        property: b2-secret-key
    - secretKey: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: cnpg
        property: garage-ro-key-id
    - secretKey: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg
        property: garage-ro-secret-key
