---
# yaml-language-server: $schema=https://schemas.materia.wtf/external-secrets.io/externalsecret_v1.json
# Garage key is read-only (never barman's owner key); B2 key lacks deleteFiles.
# b2-crypt-* hold rclone-obscured values; losing them makes the B2 copy unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-${APP}-b2-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgres-${APP}-b2-sync-secret
  data:
    - secretKey: RCLONE_CONFIG_B2CRYPT_PASSWORD
      remoteRef:
        key: cnpg
        property: b2-crypt-password
    - secretKey: RCLONE_CONFIG_B2CRYPT_PASSWORD2
      remoteRef:
        key: cnpg
        property: b2-crypt-salt
    - secretKey: RCLONE_CONFIG_B2_ACCESS_KEY_ID
      remoteRef:
        key: cnpg
        property: b2-key-id
    - secretKey: RCLONE_CONFIG_B2_SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg
        property: b2-secret-key
    - secretKey: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
      remoteRef:
        key: cnpg
        property: garage-ro-key-id
    - secretKey: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
      remoteRef:
        key: cnpg
        property: garage-ro-secret-key
