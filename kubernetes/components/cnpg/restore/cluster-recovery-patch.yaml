---
# yaml-language-server: $schema=https://schemas.materia.wtf/postgresql.cnpg.io/cluster_v1.json
# Strategic merge patch: swaps bootstrap.initdb for bootstrap.recovery from the
# barman-cloud backup. Restore procedure: ./kustomization.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-${APP}
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  bootstrap:
    initdb: null
    recovery:
      source: postgres-${APP}
      database: ${APP}
      owner: ${APP}
      # Point-in-time: uncomment, set just before the incident. Omitted = latest WAL.
      # recoveryTarget:
      #   targetTime: "2006-01-02T15:04:05+11:00"   # RFC3339 with offset; never omit it
  externalClusters:
    - name: postgres-${APP}
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: postgres-${APP}-backup
          serverName: postgres-${APP}
