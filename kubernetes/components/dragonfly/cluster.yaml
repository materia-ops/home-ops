---
# yaml-language-server: $schema=https://schemas.materia.wtf/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
  replicas: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: ${APP}-dragonfly
  authentication:
    passwordFromSecret:
      name: ${APP}-dragonfly-secret
      key: password
  snapshot:
    cron: "*/5 * * * *"
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: ceph-block
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --dbfilename=dump
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    # BullMQ-style Lua touches keys it doesn't declare
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 25m
    limits:
      memory: 512Mi
