---
# yaml-language-server: $schema=https://schemas.materia.wtf/gateway.networking.k8s.io/httproute_v1.json
# Routes /outpost.goauthentik.io/* on the app's hostname straight to the embedded
# outpost (authentik-server), past the app backend AND its ext_authz SecurityPolicy.
# Without it the post-login callback is mis-routed -> "invalid state" / HTTP 400.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP}-outpost
spec:
  hostnames:
    - ${APP_HOST:-${APP}.materia.wtf}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          namespace: security
          port: 80
