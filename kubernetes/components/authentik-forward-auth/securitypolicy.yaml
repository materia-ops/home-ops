---
# yaml-language-server: $schema=https://schemas.materia.wtf/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Forward-auth via the Authentik embedded outpost (ext_authz) on the app's HTTPRoute.
# Requires the app to be a proxy provider + embedded-outpost member in Authentik.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}-forward-auth
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP_ROUTE:-${APP}}
  extAuth:
    # failOpen=false: if the outpost is unreachable, DENY rather than serve the
    # app unauthenticated (security review #2).
    failOpen: false
    # Client headers sent to the outpost. Envoy Gateway otherwise sends an HTTP auth
    # service only Host/Method/Path/Content-Length/Authorization; without Cookie the outpost
    # loops post-login (ERR_TOO_MANY_REDIRECTS). 'accept' picks 302 (browser) vs 401 (API).
    headersToExtAuth:
      - authorization
      - cookie
      - accept
    http:
      backendRefs:
        - group: ""
          kind: Service
          # The embedded outpost is served here: no ak-outpost-* Service exists.
          name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - authorization
        - cookie
        - set-cookie
        - x-authentik-username
        - x-authentik-groups
        - x-authentik-email
        - x-authentik-name
        - x-authentik-uid
        - x-authentik-jwt
        - x-authentik-meta-jwks
        - x-authentik-meta-outpost
        - x-authentik-meta-provider
        - x-authentik-meta-app
        - x-authentik-meta-version
